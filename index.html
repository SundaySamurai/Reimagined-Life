<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vasquez's maintenance tracker</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1a2530;
    --muted: #64748b;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --ok: #16a34a;
    --ok-bg: #dcfce7;
    --warn: #b45309;
    --warn-bg: #fef3c7;
    --bad: #dc2626;
    --bad-bg: #fee2e2;
    --warranty: #7c3aed;
    --warranty-bg: #ede9fe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1720;
      --card: #1a2530;
      --text: #e5edf5;
      --muted: #94a3b8;
      --border: #2b3946;
      --accent: #3b82f6;
      --accent-dark: #60a5fa;
      --ok: #4ade80;
      --ok-bg: #14301f;
      --warn: #fbbf24;
      --warn-bg: #3a2e0d;
      --bad: #f87171;
      --bad-bg: #3a1414;
      --warranty: #a78bfa;
      --warranty-bg: #2c1f47;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 1.4rem; }
  header .sub { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .container { max-width: 960px; margin: 0 auto; padding: 20px 16px 80px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
  button, .btn {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover, .btn:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.danger { color: var(--bad); }
  button.small { padding: 4px 10px; font-size: 0.8rem; }
  a.btn { text-decoration: none; display: inline-block; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .vehicle-card { cursor: pointer; }
  .vehicle-card:hover { border-color: var(--accent); }
  .vehicle-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .vehicle-head h2 { margin: 0 0 4px; font-size: 1.15rem; }
  .vehicle-meta { color: var(--muted); font-size: 0.85rem; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .badge {
    font-size: 0.75rem;
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: 600;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.warranty { background: var(--warranty-bg); color: var(--warranty); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 50px 20px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 140px; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
  input, select, textarea {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }
  textarea { resize: vertical; min-height: 50px; }
  dialog {
    border: none;
    border-radius: 14px;
    padding: 0;
    background: var(--card);
    color: var(--text);
    max-width: 520px;
    width: 92vw;
    max-height: 88vh;
    overflow: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,0.5); }
  .dialog-inner { padding: 20px 22px; }
  .dialog-inner h3 { margin-top: 0; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .item-row:last-child { border-bottom: none; }
  .item-name { font-weight: 600; }
  .item-detail { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .item-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .warranty-note {
    background: var(--warranty-bg);
    color: var(--warranty);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.78rem;
    margin-top: 6px;
  }
  .back-link { color: var(--accent); cursor: pointer; font-size: 0.9rem; margin-bottom: 14px; display: inline-block; }
  .section-title { display: flex; justify-content: space-between; align-items: center; margin: 26px 0 10px; }
  .section-title h3 { margin: 0; }
  .checklist { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .checklist label {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 0.82rem; color: var(--text); margin: 0;
    width: auto;
  }
  .checklist input { width: auto; }
  footer.hint { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 30px; }
  .stat-strip { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .stat { font-size: 0.8rem; color: var(--muted); }
  .stat b { color: var(--text); }
</style>
</head>
<body>

<header>
  <div>
    <h1>🚗 Vasquez's maintenance tracker</h1>
    <div class="sub">Track services, stay ahead of what's due, use your warranty before it lapses.</div>
  </div>
  <div class="toolbar">
    <button class="small" title="Sync your data to a private GitHub repo you own" onclick="openSyncSettings()">☁ Cloud sync</button>
    <button id="exportBtn" class="small" title="Backup your data as a JSON file">Export data</button>
    <button id="importBtn" class="small" title="Restore data from a JSON backup">Import data</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" />
  </div>
</header>

<div class="container" id="app"></div>

<dialog id="dialog"></dialog>

<script src="vendor/tesseract/tesseract.min.js"></script>
<script>
/* ---------------- Data layer ---------------- */
const STORAGE_KEY = "vehicleMaintenanceTracker.v1";

const DEFAULT_MAINTENANCE_TEMPLATES = [
  { name: "Oil & filter change", intervalMiles: 5000, intervalMonths: 6 },
  { name: "Tire rotation", intervalMiles: 6000, intervalMonths: 6 },
  { name: "Brake inspection", intervalMiles: 10000, intervalMonths: 12 },
  { name: "Air filter replacement", intervalMiles: 20000, intervalMonths: 12 },
  { name: "Cabin air filter", intervalMiles: 20000, intervalMonths: 12 },
  { name: "Battery check", intervalMiles: null, intervalMonths: 12 },
  { name: "Wiper blades", intervalMiles: null, intervalMonths: 12 },
  { name: "Coolant flush", intervalMiles: 30000, intervalMonths: 30 },
  { name: "Transmission fluid", intervalMiles: 45000, intervalMonths: 36 },
  { name: "Spark plugs", intervalMiles: 60000, intervalMonths: null },
  { name: "Registration / inspection", intervalMiles: null, intervalMonths: 12 },
];

// Based on Royal Enfield's official minor/major service structure (5,000km/6mo minor,
// 10,000km/12mo major) — a reasonable single-cylinder motorcycle baseline; edit intervals
// per your bike/manual as needed.
const DEFAULT_MAINTENANCE_TEMPLATES_MOTORCYCLE = [
  { name: "First service (oil, filter & full inspection)", intervalMiles: 500, intervalMonths: 1 },
  { name: "Oil & filter change (minor service)", intervalMiles: 3000, intervalMonths: 6 },
  { name: "Major service (valve clearance, spark plug, air filter, throttle body)", intervalMiles: 6000, intervalMonths: 12 },
  { name: "Chain cleaning, lubrication & tension check", intervalMiles: 300, intervalMonths: null },
  { name: "Brake fluid & brake system check", intervalMiles: null, intervalMonths: 12 },
  { name: "Tire pressure & tread check", intervalMiles: null, intervalMonths: 1 },
  { name: "Battery terminals & charge check", intervalMiles: null, intervalMonths: 6 },
  { name: "Nuts, bolts & fasteners torque check", intervalMiles: null, intervalMonths: 6 },
  { name: "Registration / inspection", intervalMiles: null, intervalMonths: 12 },
];

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function todayISO() { return new Date().toISOString().slice(0, 10); }

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.error("Failed to load data", e); }
  return { vehicles: [] };
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = loadData();
let currentVehicleId = null;
let pendingReceiptFile = null;
let pendingMileagePhotoFile = null;

/* ---------------- Photo storage (IndexedDB) ---------------- */
const PHOTO_DB_NAME = "vmtPhotosDB";
const PHOTO_STORE = "photos";

function openPhotoDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(PHOTO_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(PHOTO_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function savePhotoBlob(id, blob) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, "readwrite");
    tx.objectStore(PHOTO_STORE).put(blob, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getPhotoBlob(id) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, "readonly");
    const req = tx.objectStore(PHOTO_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function deletePhotoBlob(id) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, "readwrite");
    tx.objectStore(PHOTO_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
async function dataURLToBlob(dataURL) {
  const res = await fetch(dataURL);
  return res.blob();
}

/* ---------------- OCR (Tesseract.js, vendored locally) ---------------- */
let ocrWorkerPromise = null;
function getOcrWorker() {
  if (!ocrWorkerPromise) {
    ocrWorkerPromise = (async () => {
      if (typeof Tesseract === "undefined") throw new Error("OCR engine script not loaded");
      return Tesseract.createWorker("eng", 1, {
        workerPath: "vendor/tesseract/worker.min.js",
        corePath: "vendor/tesseract/tesseract-core-lstm.wasm.js",
        langPath: "vendor/tesseract/",
        cacheMethod: "none",
        gzip: true,
      });
    })();
  }
  return ocrWorkerPromise;
}
async function scanImageText(file) {
  const worker = await getOcrWorker();
  const { data } = await worker.recognize(file);
  return data.text;
}

/* ---------------- Receipt/odometer text parsing heuristics ---------------- */
function guessDateFromText(text) {
  const now = new Date();
  const candidates = [];
  for (const m of text.matchAll(/\b(20\d{2})[\/\-](\d{1,2})[\/\-](\d{1,2})\b/g)) {
    candidates.push(new Date(+m[1], +m[2] - 1, +m[3]));
  }
  for (const m of text.matchAll(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/g)) {
    let y = +m[3];
    if (y < 100) y += y < 50 ? 2000 : 1900;
    candidates.push(new Date(y, +m[1] - 1, +m[2]));
  }
  const months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
  for (const m of text.matchAll(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})\b/gi)) {
    const mi = months.indexOf(m[1].toLowerCase());
    candidates.push(new Date(+m[3], mi, +m[2]));
  }
  const valid = candidates.filter(d => !isNaN(d) && d.getFullYear() >= 1990 && d <= new Date(now.getTime() + 86400000));
  if (valid.length === 0) return null;
  valid.sort((a, b) => b - a);
  return valid[0].toISOString().slice(0, 10);
}
function guessCostFromText(text) {
  // Match "total" but not as part of "subtotal" (negative lookbehind), and prefer
  // the last such match — the grand total typically appears after subtotal/tax lines.
  const totalMatches = [...text.matchAll(/(?<!sub)\btotal\b[^\d$]{0,15}\$?\s?(\d{1,5}(?:,\d{3})*\.\d{2})/gi)];
  if (totalMatches.length) {
    return parseFloat(totalMatches[totalMatches.length - 1][1].replace(/,/g, ""));
  }
  const amounts = [...text.matchAll(/\$\s?(\d{1,5}(?:,\d{3})*\.\d{2})/g)].map(m => parseFloat(m[1].replace(/,/g, "")));
  if (amounts.length === 0) return null;
  return Math.max(...amounts);
}
function guessMileageCandidates(text) {
  const nums = [...text.matchAll(/\b(\d{3,7})\b/g)].map(m => m[1]).filter(s => !/^0+$/.test(s));
  const uniq = [...new Set(nums)];
  uniq.sort((a, b) => b.length - a.length || (+b - +a));
  return uniq.slice(0, 5).map(s => parseInt(s, 10));
}

/* ---------------- Date/mileage math ---------------- */
function addMonths(iso, months) {
  const d = new Date(iso + "T00:00:00");
  d.setMonth(d.getMonth() + months);
  return d.toISOString().slice(0, 10);
}
function daysBetween(iso) {
  const d = new Date(iso + "T00:00:00");
  const now = new Date(todayISO() + "T00:00:00");
  return Math.round((d - now) / 86400000);
}

const DUE_SOON_MILES = 500;
const DUE_SOON_DAYS = 30;

function computeItemStatus(item, vehicle) {
  let nextDueMiles = null, nextDueDate = null;
  if (item.intervalMiles) nextDueMiles = (item.lastServiceMileage ?? vehicle.mileage) + item.intervalMiles;
  if (item.intervalMonths) nextDueDate = addMonths(item.lastServiceDate || vehicle.createdAt, item.intervalMonths);

  const milesRemaining = nextDueMiles !== null ? nextDueMiles - vehicle.mileage : null;
  const daysRemaining = nextDueDate !== null ? daysBetween(nextDueDate) : null;

  let status = "ok";
  if ((milesRemaining !== null && milesRemaining <= 0) || (daysRemaining !== null && daysRemaining <= 0)) {
    status = "bad";
  } else if ((milesRemaining !== null && milesRemaining <= DUE_SOON_MILES) || (daysRemaining !== null && daysRemaining <= DUE_SOON_DAYS)) {
    status = "warn";
  }
  return { nextDueMiles, nextDueDate, milesRemaining, daysRemaining, status };
}

function warrantyStatus(w, vehicle) {
  let expiredByDate = false, expiredByMiles = false;
  if (w.durationMonths) {
    const end = addMonths(w.startDate, w.durationMonths);
    expiredByDate = daysBetween(end) < 0;
  }
  if (w.mileageLimit) {
    expiredByMiles = vehicle.mileage > w.mileageLimit;
  }
  const active = !expiredByDate && !expiredByMiles && daysBetween(w.startDate) <= 0;
  return { active, expiredByDate, expiredByMiles };
}

/* ---------------- Rendering ---------------- */
const app = document.getElementById("app");

function render() {
  if (currentVehicleId) {
    const v = state.vehicles.find(v => v.id === currentVehicleId);
    if (v) return renderVehicleDetail(v);
    currentVehicleId = null;
  }
  renderDashboard();
}

function overallVehicleBadges(v) {
  const badges = [];
  let worst = "ok", warrantyFlag = false;
  (v.maintenanceItems || []).forEach(item => {
    const s = computeItemStatus(item, v).status;
    if (s === "bad") worst = "bad";
    else if (s === "warn" && worst !== "bad") worst = "warn";
  });
  (v.warranties || []).forEach(w => { if (warrantyStatus(w, v).active) warrantyFlag = true; });
  if (worst === "bad") badges.push(["bad", "Overdue service"]);
  else if (worst === "warn") badges.push(["warn", "Service due soon"]);
  else badges.push(["ok", "Up to date"]);
  if (warrantyFlag) badges.push(["warranty", "Active warranty"]);
  return badges;
}

function renderDashboard() {
  let html = "";
  if (state.vehicles.length === 0) {
    html += `<div class="empty card">
      <p>No vehicles yet. Add your first one to start tracking maintenance.</p>
      <button class="primary" onclick="openVehicleForm()">+ Add a vehicle</button>
    </div>`;
  } else {
    html += `<div class="toolbar" style="margin-bottom:16px;">
      <button class="primary" onclick="openVehicleForm()">+ Add vehicle</button>
    </div>`;
    state.vehicles.forEach(v => {
      const badges = overallVehicleBadges(v);
      html += `<div class="card vehicle-card" onclick="openVehicle('${v.id}')">
        <div class="vehicle-head">
          <div>
            <h2>${vehicleTypeIcon(v.type)} ${escapeHtml(v.nickname)}</h2>
            <div class="vehicle-meta">${v.year || ""} ${escapeHtml(v.make || "")} ${escapeHtml(v.model || "")}${v.type ? ` &middot; ${escapeHtml(v.type)}` : ""} &middot; ${v.mileage.toLocaleString()} mi</div>
          </div>
        </div>
        <div class="badges">
          ${badges.map(([cls, label]) => `<span class="badge ${cls}">${label}</span>`).join("")}
        </div>
      </div>`;
    });
  }
  app.innerHTML = html;
}

function renderVehicleDetail(v) {
  const items = v.maintenanceItems || [];
  const warranties = v.warranties || [];

  const itemsSorted = items.map(item => ({ item, s: computeItemStatus(item, v) }))
    .sort((a, b) => {
      const order = { bad: 0, warn: 1, ok: 2 };
      return order[a.s.status] - order[b.s.status];
    });

  let html = `<span class="back-link" onclick="goHome()">&larr; All vehicles</span>
  <div class="card">
    <div class="vehicle-head">
      <div>
        <h2>${vehicleTypeIcon(v.type)} ${escapeHtml(v.nickname)}</h2>
        <div class="vehicle-meta">${v.year || ""} ${escapeHtml(v.make || "")} ${escapeHtml(v.model || "")}${v.type ? ` &middot; ${escapeHtml(v.type)}` : ""}${v.vin ? " &middot; VIN " + escapeHtml(v.vin) : ""}</div>
      </div>
      <div class="item-actions">
        <button class="small" onclick="openVehicleForm('${v.id}')">Edit</button>
        <button class="small danger" onclick="deleteVehicle('${v.id}')">Delete</button>
      </div>
    </div>
    <div class="stat-strip">
      <div class="stat">Current mileage: <b>${v.mileage.toLocaleString()} mi</b></div>
      <button class="small" onclick="openMileageForm('${v.id}')">Update mileage</button>
      <button class="small" onclick="openMileageHistory('${v.id}')">Mileage history (${(v.mileageLog || []).length})</button>
    </div>
  </div>

  <div class="section-title">
    <h3>Maintenance</h3>
    <button class="small primary" onclick="openMaintenanceForm('${v.id}')">+ Add item</button>
  </div>
  <div class="card">`;

  if (itemsSorted.length === 0) {
    html += `<p class="vehicle-meta">No maintenance items yet. Add one, or add all common defaults.</p>
      <button class="small" onclick="addDefaultTemplates('${v.id}')">+ Add common ${v.type === "Motorcycle" ? "motorcycle " : ""}maintenance items</button>`;
  } else {
    itemsSorted.forEach(({ item, s }) => {
      const badgeCls = s.status;
      const badgeLabel = s.status === "bad" ? "Overdue" : s.status === "warn" ? "Due soon" : "OK";
      let detailParts = [];
      if (s.nextDueMiles !== null) detailParts.push(`next at ${s.nextDueMiles.toLocaleString()} mi`);
      if (s.nextDueDate !== null) detailParts.push(`by ${s.nextDueDate}`);
      const linkedWarranty = warranties.find(w => w.id === item.warrantyId);
      let warrantyNote = "";
      if (linkedWarranty && (s.status === "bad" || s.status === "warn")) {
        const ws = warrantyStatus(linkedWarranty, v);
        if (ws.active) {
          warrantyNote = `<div class="warranty-note">⚠️ May be covered under "${escapeHtml(linkedWarranty.name)}" warranty (${escapeHtml(linkedWarranty.provider || "")}) — check before paying out of pocket.</div>`;
        }
      }
      const calLink = googleCalendarLink(item, s, v);
      html += `<div class="item-row">
        <div>
          <div class="item-name">${escapeHtml(item.name)}</div>
          <div class="item-detail">${detailParts.join(" &middot; ") || "no schedule set"}${item.lastServiceDate ? ` &middot; last done ${item.lastServiceDate}` : ""}</div>
          ${warrantyNote}
        </div>
        <div class="item-actions">
          <span class="badge ${badgeCls}">${badgeLabel}</span>
          ${calLink ? `<a class="btn small" target="_blank" href="${calLink}">📅 Add reminder</a>` : ""}
          <button class="small" onclick="logService('${v.id}','${item.id}')">Log done</button>
          <button class="small" onclick="openHistory('${v.id}','${item.id}')">History (${(item.history || []).length})</button>
          <button class="small" onclick="openMaintenanceForm('${v.id}','${item.id}')">Edit</button>
          <button class="small danger" onclick="deleteMaintenance('${v.id}','${item.id}')">Delete</button>
        </div>
      </div>`;
    });
  }
  html += `</div>`;

  html += `<div class="section-title">
    <h3>Warranties</h3>
    <button class="small primary" onclick="openWarrantyForm('${v.id}')">+ Add warranty</button>
  </div>
  <div class="card">`;
  if (warranties.length === 0) {
    html += `<p class="vehicle-meta">No warranties tracked yet.</p>`;
  } else {
    warranties.forEach(w => {
      const ws = warrantyStatus(w, v);
      const end = w.durationMonths ? addMonths(w.startDate, w.durationMonths) : null;
      html += `<div class="item-row">
        <div>
          <div class="item-name">${escapeHtml(w.name)}</div>
          <div class="item-detail">
            ${escapeHtml(w.provider || "")}${end ? ` &middot; expires ${end}` : ""}${w.mileageLimit ? ` &middot; up to ${w.mileageLimit.toLocaleString()} mi` : ""}
          </div>
          ${w.notes ? `<div class="item-detail">${escapeHtml(w.notes)}</div>` : ""}
        </div>
        <div class="item-actions">
          <span class="badge ${ws.active ? "ok" : "bad"}">${ws.active ? "Active" : "Expired"}</span>
          <button class="small" onclick="openWarrantyForm('${v.id}','${w.id}')">Edit</button>
          <button class="small danger" onclick="deleteWarranty('${v.id}','${w.id}')">Delete</button>
        </div>
      </div>`;
    });
  }
  html += `</div>`;

  app.innerHTML = html;
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function vehicleTypeIcon(type) {
  return type === "Motorcycle" ? "🏍️" : "🚗";
}

function googleCalendarLink(item, s, vehicle) {
  // If already due/overdue (by either mileage or date), remind today.
  // Otherwise use the date-based due date if there is one.
  let dateISO;
  if (s.status === "bad" || s.status === "warn") {
    dateISO = todayISO();
  } else {
    dateISO = s.nextDueDate || (s.nextDueMiles ? todayISO() : null);
  }
  if (!dateISO) return null;
  const start = dateISO.replace(/-/g, "");
  const endDate = new Date(dateISO + "T00:00:00");
  endDate.setDate(endDate.getDate() + 1);
  const end = endDate.toISOString().slice(0, 10).replace(/-/g, "");
  const text = encodeURIComponent(`${item.name} due — ${vehicle.nickname}`);
  const detailsParts = [];
  if (s.nextDueMiles) detailsParts.push(`Due by ${s.nextDueMiles.toLocaleString()} miles`);
  if (s.nextDueDate) detailsParts.push(`Due by ${s.nextDueDate}`);
  const details = encodeURIComponent(detailsParts.join(". "));
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${start}/${end}&details=${details}`;
}

/* ---------------- Cloud sync (your own private GitHub repo) ---------------- */
const SYNC_CONFIG_KEY = "vmtSyncConfig.v1";
const SYNC_FILE_PATH = "data.json";

function loadSyncConfig() {
  try {
    const raw = localStorage.getItem(SYNC_CONFIG_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.error(e); }
  return { token: "", owner: "", repo: "", branch: "main", lastPushAt: null, lastPullAt: null };
}
function saveSyncConfig(cfg) { localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg)); }

function utf8ToBase64(str) { return btoa(unescape(encodeURIComponent(str))); }
function base64ToUtf8(b64) { return decodeURIComponent(escape(atob(b64.replace(/\n/g, "")))); }

async function githubApi(cfg, path, options = {}) {
  const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}${path}`, {
    ...options,
    headers: {
      "Authorization": `Bearer ${cfg.token}`,
      "Accept": "application/vnd.github+json",
      ...(options.headers || {}),
    },
  });
  return res;
}

  `);
}
function readSyncSettingsForm() {
  return {
    token: document.getElementById("f-synctoken").value.trim(),
    owner: document.getElementById("f-syncowner").value.trim(),
    repo: document.getElementById("f-syncrepo").value.trim(),
    branch: document.getElementById("f-syncbranch").value.trim() || "main",
  };
}
function saveSyncSettingsForm() {
  const cfg = loadSyncConfig();
  const form = readSyncSettingsForm();
  saveSyncConfig({ ...cfg, ...form });
  closeDialog();
}
function setSyncStatus(msg) {
  const el = document.getElementById("sync-status");
  if (el) el.textContent = msg;
}
async function doSyncPush() {
  const form = readSyncSettingsForm();
  if (!form.token || !form.owner || !form.repo) {
    setSyncStatus("Please fill in the token, repo owner, and repo name first.");
    return;
  }
  let cfg = { ...loadSyncConfig(), ...form };
  saveSyncConfig(cfg);
  setSyncStatus("Pushing…");
  try {
    const payload = await buildBackupPayload();
    const content = utf8ToBase64(JSON.stringify(payload, null, 2));

    let sha = null;
    const getRes = await githubApi(cfg, `/contents/${SYNC_FILE_PATH}?ref=${encodeURIComponent(cfg.branch)}`);
    if (getRes.ok) {
      const existing = await getRes.json();
      sha = existing.sha;
    } else if (getRes.status !== 404) {
      throw new Error(`Couldn't check existing file (${getRes.status})`);
    }

    const putRes = await githubApi(cfg, `/contents/${SYNC_FILE_PATH}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: `Update vehicle tracker data — ${new Date().toISOString()}`,
        content,
        branch: cfg.branch,
        ...(sha ? { sha } : {}),
      }),
    });
    if (!putRes.ok) {
      const err = await putRes.json().catch(() => ({}));
      throw new Error(err.message || `Push failed (${putRes.status})`);
    }
    cfg = { ...cfg, lastPushAt: Date.now() };
    saveSyncConfig(cfg);
    setSyncStatus(`Pushed successfully at ${new Date(cfg.lastPushAt).toLocaleString()}.`);
  } catch (e) {
    console.error(e);
    setSyncStatus(`Push failed: ${e.message}`);
  }
}
async function doSyncPull() {
  const form = readSyncSettingsForm();
  if (!form.token || !form.owner || !form.repo) {
    setSyncStatus("Please fill in the token, repo owner, and repo name first.");
    return;
  }
  let cfg = { ...loadSyncConfig(), ...form };
  saveSyncConfig(cfg);
  if (!confirm("This will replace your current data on this device with whatever is in the cloud. Continue?")) return;
  setSyncStatus("Pulling…");
  try {
    const getRes = await githubApi(cfg, `/contents/${SYNC_FILE_PATH}?ref=${encodeURIComponent(cfg.branch)}`);
    if (getRes.status === 404) {
      setSyncStatus("No data found in the cloud yet — try pushing from a device with data first.");
      return;
    }
    if (!getRes.ok) {
      const err = await getRes.json().catch(() => ({}));
      throw new Error(err.message || `Pull failed (${getRes.status})`);
    }
    const file = await getRes.json();
    const parsed = JSON.parse(base64ToUtf8(file.content));
    await applyBackupPayload(parsed);
    cfg = { ...cfg, lastPullAt: Date.now() };
    saveSyncConfig(cfg);
    setSyncStatus(`Pulled successfully at ${new Date(cfg.lastPullAt).toLocaleString()}.`);
  } catch (e) {
    console.error(e);
    setSyncStatus(`Pull failed: ${e.message}`);
  }
}

/* ---------------- Import / export (shared with cloud sync) ---------------- */
async function buildBackupPayload() {
  const photoIds = new Set();
  state.vehicles.forEach(v => {
    (v.mileageLog || []).forEach(e => e.photoId && photoIds.add(e.photoId));
    (v.maintenanceItems || []).forEach(i => (i.history || []).forEach(e => e.photoId && photoIds.add(e.photoId)));
  });
  const photos = {};
  for (const id of photoIds) {
    try {
      const blob = await getPhotoBlob(id);
      if (blob) photos[id] = await blobToDataURL(blob);
    } catch (e) { console.error("Failed to read photo for backup", id, e); }
  }
  return { ...state, photos };
}
async function applyBackupPayload(parsed) {
  if (!parsed || !parsed.vehicles) throw new Error("Invalid backup data");
  const photos = parsed.photos || {};
  delete parsed.photos;
  state = parsed;
  saveData();
  for (const [id, dataURL] of Object.entries(photos)) {
    try {
      const blob = await dataURLToBlob(dataURL);
      await savePhotoBlob(id, blob);
    } catch (e) { console.error("Failed to restore photo", id, e); }
  }
  currentVehicleId = null;
  render();
}

document.getElementById("exportBtn").addEventListener("click", async () => {
  const btn = document.getElementById("exportBtn");
  const originalLabel = btn.textContent;
  btn.textContent = "Exporting…";
  btn.disabled = true;
  try {
    const exportObj = await buildBackupPayload();
    const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `vehicle-maintenance-backup-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  } finally {
    btn.textContent = originalLabel;
    btn.disabled = false;
  }
});
document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed.vehicles) throw new Error("Invalid file");
      if (confirm("This will replace your current data with the imported backup. Continue?")) {
        await applyBackupPayload(parsed);
      }
    } catch (err) {
      console.error(err);
      alert("Could not read that file as a valid backup.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

/* ---------------- Init ---------------- */
render();
</script>
