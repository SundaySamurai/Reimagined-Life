function goHouseholdHome() { currentHouseholdItemId = null; render(); }
function switchHouseholdView(view) { currentHouseholdView = view; currentHouseholdItemId = null; render(); }

function renderTaskRow({ item, task, status }, opts = {}) {
  if (task.inactive) {
    return `<div class="task-row ${responsibilityClass(item.responsibility)}" style="opacity:0.6;">
      <div class="task-main">
        <div class="task-title-line">
          <span>${locationIcon(item.location)}</span>
          <span>${escapeHtml(item.name)} — ${escapeHtml(task.task_name)}</span>
          <span class="resp-pill">${RESPONSIBILITY_LABELS[item.responsibility] || "Verify"}</span>
        </div>
        <div class="task-sub">Marked not applicable</div>
      </div>
    </div>`;
  }
  const dueLabelText = status.bucket === "overdue"
    ? `Overdue${status.daysRemaining < 0 ? ` (${Math.abs(status.daysRemaining)}d)` : ""}`
    : `Due ${status.nextDueDate}`;
  const showFullActions = item.responsibility === "personal" || !opts.awarenessOnly;
  const actionsHtml = showFullActions
    ? `<button class="small primary" onclick="quickCompleteTask('${item.id}','${task.id}')">✓ Done</button>
       <button class="small" onclick="expandCompleteTask('${item.id}','${task.id}')">Detail</button>
       <button class="small" onclick="skipTask('${item.id}','${task.id}')">Skip</button>
       <button class="small danger" onclick="markTaskNA('${item.id}','${task.id}')">N/A</button>`
    : `<button class="small" onclick="expandCompleteTask('${item.id}','${task.id}')">Log</button>`;
  return `<div class="task-row ${responsibilityClass(item.responsibility)} ${task.safety_critical ? "safety" : ""}">
    <div class="task-main" onclick="openHouseholdItem('${item.id}')" style="cursor:pointer;">
      <div class="task-title-line">
        <span>${locationIcon(item.location)}</span>
        <span>${escapeHtml(item.name)} — ${escapeHtml(task.task_name)}</span>
        ${task.safety_critical ? `<span class="safety-badge">⚠ Safety</span>` : ""}
        <span class="resp-pill">${RESPONSIBILITY_LABELS[item.responsibility] || "Verify"}</span>
      </div>
      <div class="task-sub">${escapeHtml(item.category)} &middot; ${intervalLabel(task.interval_type, task.interval_value)}${item.responsibility_note ? " &middot; " + escapeHtml(item.responsibility_note) : ""}</div>
    </div>
    <div class="item-actions">
      <span class="due-label ${status.bucket}">${dueLabelText}</span>
      ${actionsHtml}
    </div>
  </div>`;
}

function renderHouseholdDoneFeed(personalOnly) {
  const entries = [];
  householdState.items.forEach(item => {
    if (personalOnly && item.responsibility !== "personal") return;
    (item.tasks || []).forEach(task => {
      (task.history || []).forEach(h => entries.push({ item, task, h }));
    });
  });
  entries.sort((a, b) => (b.h.completed_date || "").localeCompare(a.h.completed_date || ""));
  const recent = entries.slice(0, 15);
  if (recent.length === 0) return `<p class="vehicle-meta">Nothing logged yet.</p>`;
  const methodLabel = { diy: "DIY", professional: "Professional", reported_to_hoa: "Reported to HOA" };
  return recent.map(({ item, task, h }) => `
    <div class="item-row">
      <div>
        <div class="item-name">${escapeHtml(item.name)} — ${escapeHtml(task.task_name)}</div>
        <div class="item-detail">${h.completed_date || "—"}${h.method ? " &middot; " + (methodLabel[h.method] || h.method) : ""}${h.cost != null ? " &middot; $" + h.cost.toFixed(2) : ""}${h.note ? " — " + escapeHtml(h.note).slice(0, 120) : ""}</div>
      </div>
      <div class="item-actions">
        <button class="small" onclick="editHouseholdHistoryEntry('${item.id}','${task.id}','${h.id}')">Edit</button>
        <button class="small danger" onclick="deleteHouseholdHistoryEntryFromDone('${item.id}','${task.id}','${h.id}')">Delete</button>
      </div>
    </div>`).join("");
}

function renderHouseholdList() {
  let html = `<div class="sub-tabs">
    <button class="sub-tab-btn ${currentHouseholdView === "todo" ? "active" : ""}" onclick="switchHouseholdView('todo')">My To-Do</button>
    <button class="sub-tab-btn ${currentHouseholdView === "overview" ? "active" : ""}" onclick="switchHouseholdView('overview')">Property Overview</button>
  </div>
  <div class="toolbar" style="margin-bottom:16px;">
    <button class="primary" onclick="openAddHouseholdItem()">+ Add Item</button>
    <button class="small" onclick="requestHouseholdNotifications()">🔔 Enable reminders</button>
  </div>`;

  const personalOnly = currentHouseholdView === "todo";
  const rows = allHouseholdTaskRows({ personalOnly });
  const pending = rows.filter(r => r.status.bucket === "overdue");
  const upcoming = rows.filter(r => r.status.bucket !== "overdue");

  if (householdState.items.length === 0) {
    html += `<div class="empty card">
      <p>No household items yet. Add one from the catalog or create your own.</p>
      <button class="primary" onclick="openAddHouseholdItem()">+ Add Item</button>
    </div>`;
  } else if (rows.length === 0) {
    html += `<div class="empty card"><p>${currentHouseholdView === "todo" ? "Nothing on your personal to-do list right now." : "No tracked tasks yet."}</p></div>`;
  } else {
    const awarenessOnly = currentHouseholdView === "overview";
    html += `<div class="section-title"><h3>⚠️ Pending${pending.length ? ` (${pending.length})` : ""}</h3></div>
    ${pending.length ? pending.map(r => renderTaskRow(r, { awarenessOnly })).join("") : `<div class="card"><p class="vehicle-meta">Nothing overdue right now 🎉</p></div>`}

    <div class="section-title"><h3>📅 Upcoming${upcoming.length ? ` (${upcoming.length})` : ""}</h3></div>
    ${upcoming.length ? upcoming.map(r => renderTaskRow(r, { awarenessOnly })).join("") : `<div class="card"><p class="vehicle-meta">Nothing else scheduled.</p></div>`}

    <div class="section-title"><h3>✅ Done</h3></div>
    <div class="card">${renderHouseholdDoneFeed(personalOnly)}</div>`;
  }

  if (currentHouseholdView === "overview") {
    const noTaskItems = householdState.items.filter(i => !(i.tasks && i.tasks.length));
    if (noTaskItems.length) {
      html += `<div class="section-title"><h3>Tracking only (no scheduled tasks)</h3></div>`;
      noTaskItems.forEach(item => {
        html += `<div class="card ${responsibilityClass(item.responsibility)}" style="border-left:4px solid var(--resp); cursor:pointer;" onclick="openHouseholdItem('${item.id}')">
          <div class="task-title-line">
            <span>${locationIcon(item.location)}</span>
            <span style="font-weight:600;">${escapeHtml(item.name)}</span>
            <span class="resp-pill">${RESPONSIBILITY_LABELS[item.responsibility] || "Verify"}</span>
          </div>
          <div class="task-sub">${escapeHtml(item.category)}${item.responsibility_note ? " &middot; " + escapeHtml(item.responsibility_note) : ""}</div>
        </div>`;
      });
    }
  }

  app.innerHTML = html;
}

function renderHouseholdItemDetail(item) {
  const tasks = item.tasks || [];
  const bucketOrder = { overdue: 0, this_month: 1, this_quarter: 2, later: 3, inactive: 4 };
  const rows = tasks.map(task => ({ item, task, status: computeTaskStatus(task, item) }))
    .sort((a, b) => bucketOrder[a.status.bucket] - bucketOrder[b.status.bucket]);

  let html = `<span class="back-link" onclick="goHouseholdHome()">&larr; All household items</span>
  <div class="card ${responsibilityClass(item.responsibility)}" style="border-left:4px solid var(--resp);">
    <div class="vehicle-head">
      <div>
        <h2>${locationIcon(item.location)} ${escapeHtml(item.name)} <span class="resp-pill">${RESPONSIBILITY_LABELS[item.responsibility] || "Verify"}</span></h2>
        <div class="vehicle-meta">${escapeHtml(item.category)}${item.brand ? " &middot; " + escapeHtml(item.brand) : ""}${item.model ? " " + escapeHtml(item.model) : ""}${item.install_date ? " &middot; installed " + item.install_date : ""}</div>
        ${item.responsibility_note ? `<div class="warranty-note">${escapeHtml(item.responsibility_note)}</div>` : ""}
        ${item.notes ? `<div class="item-detail" style="margin-top:6px;">${escapeHtml(item.notes)}</div>` : ""}
      </div>
      <div class="item-actions">
        <button class="small" onclick="openHouseholdItemForm('${item.id}')">Edit</button>
        <button class="small danger" onclick="deleteHouseholdItem('${item.id}')">Delete</button>
      </div>
    </div>
  </div>

  <div class="section-title">
    <h3>Tasks</h3>
    <button class="small primary" onclick="openHouseholdTaskForm('${item.id}')">+ Add task</button>
  </div>`;

  if (rows.length === 0) {
    html += `<div class="card"><p class="vehicle-meta">No tasks yet for this item.</p></div>`;
  } else {
    html += rows.map(r => `<div>${renderTaskRow(r)}
      <div style="margin:-6px 0 10px 4px;">
        <button class="small" onclick="openHouseholdTaskForm('${item.id}','${r.task.id}')">Edit task</button>
        <button class="small" onclick="openHouseholdTaskHistory('${item.id}','${r.task.id}')">History (${(r.task.history || []).length})</button>
        <button class="small danger" onclick="deleteHouseholdTask('${item.id}','${r.task.id}')">Delete task</button>
        ${r.task.inactive ? `<button class="small" onclick="reactivateTask('${item.id}','${r.task.id}')">Reactivate</button>` : ""}
      </div>
    </div>`).join("");
  }

  app.innerHTML = html;
}

/* ---------------- Add item flow (catalog or custom) ---------------- */
function openAddHouseholdItem() {
  const categories = Object.keys(HOUSEHOLD_CATALOG);
  showDialog(`
    <h3>Add household item</h3>
    <label>Category</label>
    <select id="f-h-category" onchange="onHouseholdCategoryChange()">
      ${categories.map(c => `<option value="${c}">${c}</option>`).join("")}
      <option value="Other">Other</option>
    </select>
    <label>Starting point</label>
    <select id="f-h-preset" onchange="onHouseholdPresetChange()"></select>
    <div id="f-h-preset-hint" class="vehicle-meta" style="margin-top:8px;"></div>
    <div class="dialog-actions">
      <button onclick="closeDialog()">Cancel</button>
      <button class="primary" onclick="continueAddHouseholdItem()">Next</button>
    </div>
  `);
  onHouseholdCategoryChange();
}
function onHouseholdCategoryChange() {
  const category = document.getElementById("f-h-category").value;
  const presetSelect = document.getElementById("f-h-preset");
  const entries = HOUSEHOLD_CATALOG[category] || [];
  presetSelect.innerHTML = `<option value="">-- Custom (blank) --</option>` +
    entries.map((e, idx) => `<option value="${idx}">${escapeHtml(e.name)}</option>`).join("");
  onHouseholdPresetChange();
}
function onHouseholdPresetChange() {
  const category = document.getElementById("f-h-category").value;
  const idx = document.getElementById("f-h-preset").value;
  const hint = document.getElementById("f-h-preset-hint");
  if (idx === "" || !HOUSEHOLD_CATALOG[category]) { hint.textContent = ""; return; }
  const preset = HOUSEHOLD_CATALOG[category][idx];
  const taskSummary = (preset.tasks || []).map(t => `${t.name} (${intervalLabel(t.interval_type, t.interval_value)})`).join(", ");
  hint.innerHTML = `Suggested: ${locationIcon(preset.location)} ${preset.location.replace(/_/g, " ")} &middot; ${RESPONSIBILITY_LABELS[preset.responsibility]}${taskSummary ? " &middot; Tasks: " + escapeHtml(taskSummary) : " &middot; tracking only, no personal tasks"}<br>All of this is editable next.`;
}
function continueAddHouseholdItem() {
  const category = document.getElementById("f-h-category").value;
  const idx = document.getElementById("f-h-preset").value;
  const preset = (idx !== "" && HOUSEHOLD_CATALOG[category]) ? HOUSEHOLD_CATALOG[category][idx] : null;
  closeDialog();
  openHouseholdItemForm(null, { category, preset });
}

/* ---------------- Item form ---------------- */
function openHouseholdItemForm(itemId, prefill) {
  const item = itemId ? householdState.items.find(i => i.id === itemId) : null;
  const preset = prefill && prefill.preset;
  pendingHouseholdPresetTasks = (!item && preset) ? (preset.tasks || []) : [];
  pendingHouseholdIsCustom = item ? item.is_custom : !preset;

  const categories = [...Object.keys(HOUSEHOLD_CATALOG), "Other"];
  const category = item ? item.category : (prefill ? prefill.category : categories[0]);
  const name = item ? item.name : (preset ? preset.name : "");
  const location = item ? item.location : (preset ? preset.location : "inside_unit");
  const responsibility = item ? item.responsibility : (preset ? preset.responsibility : "verify");
  const responsibilityNote = item ? item.responsibility_note : (preset ? (preset.responsibility_note || "") : "");
  const notes = item ? item.notes : (preset ? (preset.notes || "") : "");

  showDialog(`
    <h3>${item ? "Edit" : "Add"} household item</h3>
    <label>Name</label>
    <input id="f-h-name" value="${escapeHtml(name)}" placeholder="e.g. Kitchen Fridge" />
    <label>Category</label>
    <select id="f-h-cat">${categories.map(c => `<option value="${c}" ${c === category ? "selected" : ""}>${c}</option>`).join("")}</select>
    <div class="row">
      <div><label>Location</label>
        <select id="f-h-loc">
          <option value="inside_unit" ${location === "inside_unit" ? "selected" : ""}>Inside unit</option>
          <option value="outside_unit" ${location === "outside_unit" ? "selected" : ""}>Outside unit</option>
        </select>
      </div>
      <div><label>Responsibility</label>
        <select id="f-h-resp">
          ${["personal", "association", "limited_common_element", "verify"].map(r => `<option value="${r}" ${responsibility === r ? "selected" : ""}>${RESPONSIBILITY_LABELS[r]}</option>`).join("")}
        </select>
      </div>
    </div>
    <label>Responsibility note (optional)</label>
    <textarea id="f-h-respnote" placeholder="e.g. surface only, structure is HOA per Art. 7.3">${escapeHtml(responsibilityNote || "")}</textarea>
    <div class="row">
      <div><label>Brand (optional)</label><input id="f-h-brand" value="${item ? escapeHtml(item.brand || "") : ""}" /></div>
      <div><label>Model (optional)</label><input id="f-h-model" value="${item ? escapeHtml(item.model || "") : ""}" /></div>
      <div><label>Install date (optional)</label><input id="f-h-install" type="date" value="${item ? item.install_date || "" : ""}" /></div>
    </div>
    <label>Notes</label>
    <textarea id="f-h-notes">${escapeHtml(notes || "")}</textarea>
    <div class="dialog-actions">
      <button onclick="closeDialog()">Cancel</button>
      <button class="primary" onclick="saveHouseholdItemForm(${item ? `'${item.id}'` : "null"})">Save</button>
    </div>
  `);
}
function saveHouseholdItemForm(itemId) {
  const name = document.getElementById("f-h-name").value.trim();
  if (!name) return;
  const category = document.getElementById("f-h-cat").value;
  const location = document.getElementById("f-h-loc").value;
  const responsibility = document.getElementById("f-h-resp").value;
  const responsibility_note = document.getElementById("f-h-respnote").value.trim();
  const brand = document.getElementById("f-h-brand").value.trim();
  const model = document.getElementById("f-h-model").value.trim();
  const install_date = document.getElementById("f-h-install").value || null;
  const notes = document.getElementById("f-h-notes").value.trim();

  if (itemId) {
    const item = householdState.items.find(i => i.id === itemId);
    Object.assign(item, { name, category, location, responsibility, responsibility_note, brand, model, install_date, notes });
  } else {
    const newItem = {
      id: uid(), name, category, location, responsibility, responsibility_note,
      brand, model, install_date, notes,
      is_custom: pendingHouseholdIsCustom,
      createdAt: todayISO(),
      tasks: [],
    };
    pendingHouseholdPresetTasks.forEach(t => {
      newItem.tasks.push({
        id: uid(), task_name: t.name, interval_type: t.interval_type, interval_value: t.interval_value,
        last_completed_date: null, safety_critical: !!t.safety_critical, history: [], inactive: false,
      });
    });
    householdState.items.push(newItem);
    itemId = newItem.id;
  }
  saveHouseholdData();
  closeDialog();
  currentHouseholdItemId = itemId;
  render();
}
function deleteHouseholdItem(itemId) {
  if (!confirm("Delete this item and all its tasks/history?")) return;
  householdState.items = householdState.items.filter(i => i.id !== itemId);
  saveHouseholdData();
  goHouseholdHome();
}

/* ---------------- Task form ---------------- */
function openHouseholdTaskForm(itemId, taskId) {
  const item = householdState.items.find(i => i.id === itemId);
  const task = taskId ? item.tasks.find(t => t.id === taskId) : null;
  showDialog(`
    <h3>${task ? "Edit" : "Add"} task</h3>
    <label>Task name</label>
    <input id="f-h-taskname" value="${task ? escapeHtml(task.task_name) : ""}" placeholder="e.g. Replace filter" />
    <div class="row">
      <div><label>Interval</label>
        <select id="f-h-intervaltype">
          ${["days", "weeks", "months", "years"].map(t => `<option value="${t}" ${(task ? task.interval_type : "months") === t ? "selected" : ""}>${t}</option>`).join("")}
        </select>
      </div>
      <div><label>Every</label><input id="f-h-intervalvalue" type="number" min="1" value="${task ? task.interval_value : 12}" /></div>
    </div>
    <label>Last completed (optional)</label>
    <input id="f-h-lastdone" type="date" value="${task ? task.last_completed_date || "" : ""}" />
    <div class="checklist">
      <label><input type="checkbox" id="f-h-safety" ${task && task.safety_critical ? "checked" : ""} /> Safety-critical</label>
    </div>
    <div class="dialog-actions">
      <button onclick="closeDialog()">Cancel</button>
      <button class="primary" onclick="saveHouseholdTaskForm('${itemId}'${task ? `,'${task.id}'` : ""})">Save</button>
    </div>
  `);
}
function saveHouseholdTaskForm(itemId, taskId) {
  const item = householdState.items.find(i => i.id === itemId);
  const task_name = document.getElementById("f-h-taskname").value.trim();
  if (!task_name) return;
  const interval_type = document.getElementById("f-h-intervaltype").value;
  const interval_value = parseInt(document.getElementById("f-h-intervalvalue").value, 10) || 1;
  const last_completed_date = document.getElementById("f-h-lastdone").value || null;
  const safety_critical = document.getElementById("f-h-safety").checked;

  item.tasks = item.tasks || [];
  if (taskId) {
    const task = item.tasks.find(t => t.id === taskId);
    Object.assign(task, { task_name, interval_type, interval_value, last_completed_date, safety_critical });
  } else {
    item.tasks.push({ id: uid(), task_name, interval_type, interval_value, last_completed_date, safety_critical, history: [], inactive: false });
  }
  saveHouseholdData();
  closeDialog();
  render();
}
function deleteHouseholdTask(itemId, taskId) {
  const item = householdState.items.find(i => i.id === itemId);
  item.tasks = item.tasks.filter(t => t.id !== taskId);
  saveHouseholdData();
  render();
}

/* ---------------- Completion actions (Done / Skip / N/A) ---------------- */
function quickCompleteTask(itemId, taskId) {
  completeHouseholdTask(itemId, taskId, { date: todayISO(), method: "diy", cost: null, note: "" });
}
function completeHouseholdTask(itemId, taskId, entry) {
  const item = householdState.items.find(i => i.id === itemId);
  const task = item.tasks.find(t => t.id === taskId);
  task.history = task.history || [];
  task.history.push({ id: uid(), completed_date: entry.date, method: entry.method, cost: entry.cost, note: entry.note });
  task.last_completed_date = entry.date;
  saveHouseholdData();
  render();
  showToast(`✓ Marked "${task.task_name}" done.`);
}
function expandCompleteTask(itemId, taskId) {
  const item = householdState.items.find(i => i.id === itemId);
  const task = item.tasks.find(t => t.id === taskId);
  showDialog(`
    <h3>Log "${escapeHtml(task.task_name)}" done</h3>
    <label>Date completed</label>
    <input id="f-h-donedate" type="date" value="${todayISO()}" />
    <label>Method</label>
    <select id="f-h-donemethod">
      <option value="diy">DIY</option>
      <option value="professional">Professional</option>
      <option value="reported_to_hoa">Reported to HOA</option>
    </select>
    <label>Cost (optional)</label>
    <input id="f-h-donecost" type="number" step="0.01" placeholder="e.g. 45.00" />
    <label>Note (optional)</label>
    <textarea id="f-h-donenote"></textarea>
    <div class="dialog-actions">
      <button onclick="closeDialog()">Cancel</button>
      <button class="primary" onclick="confirmExpandComplete('${itemId}','${taskId}')">Save</button>
    </div>
  `);
}
function confirmExpandComplete(itemId, taskId) {
  const date = document.getElementById("f-h-donedate").value || todayISO();
  const method = document.getElementById("f-h-donemethod").value;
  const costRaw = document.getElementById("f-h-donecost").value;
  const cost = costRaw ? parseFloat(costRaw) : null;
  const note = document.getElementById("f-h-donenote").value.trim();
  closeDialog();
  completeHouseholdTask(itemId, taskId, { date, method, cost, note });
}
function skipTask(itemId, taskId) {
  const item = householdState.items.find(i => i.id === itemId);
  const task = item.tasks.find(t => t.id === taskId);
  task.history = task.history || [];
  task.history.push({ id: uid(), completed_date: todayISO(), method: null, cost: null, note: "Skipped" });
  task.last_completed_date = todayISO();
  saveHouseholdData();
  render();
  showToast(`Skipped "${task.task_name}" — pushed to next interval.`);
}
function markTaskNA(itemId, taskId) {
  if (!confirm("Mark this task as not applicable? It'll be hidden from your lists — you can reactivate it later from the item page.")) return;
  const item = householdState.items.find(i => i.id === itemId);
  const task = item.tasks.find(t => t.id === taskId);
  task.inactive = true;
  saveHouseholdData();
  render();
}
function reactivateTask(itemId, taskId) {
  const item = householdState.items.find(i => i.id === itemId);
  const task = item.tasks.find(t => t.id === taskId);
  task.inactive = false;
  saveHouseholdData();
  render();
}

/* ---------------- Completion history ---------------- */
function openHouseholdTaskHistory(itemId, taskId) {
  const item = householdState.items.find(i => i.id === itemId);
  const task = item.tasks.find(t => t.id === taskId);
  const history = (task.history || []).slice().sort((a, b) => (b.completed_date || "").localeCompare(a.completed_date || ""));
  const methodLabel = { diy: "DIY", professional: "Professional", reported_to_hoa: "Reported to HOA" };
  const rows = history.map(h => `
    <div class="item-row">
      <div>
        <div class="item-name">${h.completed_date || "—"}${h.method ? " &middot; " + (methodLabel[h.method] || h.method) : ""}</div>
        <div class="item-detail">${h.cost != null ? "$" + h.cost.toFixed(2) + " &middot; " : ""}${h.note ? escapeHtml(h.note) : ""}</div>
      </div>
      <div class="item-actions">
        <button class="small" onclick="editHouseholdHistoryEntry('${itemId}','${taskId}','${h.id}')">Edit</button>
        <button class="small danger" onclick="deleteHouseholdHistoryEntry('${itemId}','${taskId}','${h.id}')">Delete</button>
      </div>
    </div>`).join("") || `<p class="vehicle-meta">No history yet.</p>`;
  showDialog(`<h3>History — ${escapeHtml(task.task_name)}</h3>${rows}<div class="dialog-actions"><button onclick="closeDialog()">Close</button></div>`);
}
function deleteHouseholdHistoryEntry(itemId, taskId, entryId) {
  const item = householdState.items.find(i => i.id === itemId);
  const task = item.tasks.find(t => t.id === taskId);
  task.history = (task.history || []).filter(h => h.id !== entryId);
  saveHouseholdData();
  openHouseholdTaskHistory(itemId, taskId);
}
function deleteHouseholdHistoryEntryFromDone(itemId, taskId, entryId) {
  if (!confirm("Delete this entry?")) return;
  const item = householdState.items.find(i => i.id === itemId);
  const task = item.tasks.find(t => t.id === taskId);
  task.history = (task.history || []).filter(h => h.id !== entryId);
  saveHouseholdData();
  render();
}
function editHouseholdHistoryEntry(itemId, taskId, entryId) {
  const item = householdState.items.find(i => i.id === itemId);
  const task = item.tasks.find(t => t.id === taskId);
  const entry = task.history.find(h => h.id === entryId);
  showDialog(`
    <h3>Edit entry — ${escapeHtml(task.task_name)}</h3>
    <label>Date completed</label>
    <input id="f-h-edithistdate" type="date" value="${entry.completed_date || ""}" />
    <label>Method</label>
    <select id="f-h-edithistmethod">
      <option value="diy" ${entry.method === "diy" ? "selected" : ""}>DIY</option>
      <option value="professional" ${entry.method === "professional" ? "selected" : ""}>Professional</option>
      <option value="reported_to_hoa" ${entry.method === "reported_to_hoa" ? "selected" : ""}>Reported to HOA</option>
    </select>
    <label>Cost (optional)</label>
    <input id="f-h-edithistcost" type="number" step="0.01" value="${entry.cost != null ? entry.cost : ""}" />
    <label>Note (optional)</label>
    <textarea id="f-h-edithistnote">${escapeHtml(entry.note || "")}</textarea>
    <div class="dialog-actions">
      <button onclick="closeDialog()">Cancel</button>
      <button class="primary" onclick="confirmEditHouseholdHistoryEntry('${itemId}','${taskId}','${entryId}')">Save</button>
    </div>
  `);
}
function confirmEditHouseholdHistoryEntry(itemId, taskId, entryId) {
  const item = householdState.items.find(i => i.id === itemId);
  const task = item.tasks.find(t => t.id === taskId);
  const entry = task.history.find(h => h.id === entryId);
  entry.completed_date = document.getElementById("f-h-edithistdate").value || entry.completed_date;
  entry.method = document.getElementById("f-h-edithistmethod").value;
  const costRaw = document.getElementById("f-h-edithistcost").value;
  entry.cost = costRaw ? parseFloat(costRaw) : null;
  entry.note = document.getElementById("f-h-edithistnote").value.trim();
  const mostRecent = task.history.slice().sort((a, b) => (b.completed_date || "").localeCompare(a.completed_date || ""))[0];
  if (mostRecent && mostRecent.id === entryId) task.last_completed_date = entry.completed_date;
  saveHouseholdData();
  closeDialog();
  render();
  showToast("✓ Entry updated.");
}

/* ---------------- Notifications ---------------- */
const HOUSEHOLD_NOTIFIED_KEY = "householdNotified.v1";
function loadNotifiedLog() {
  try { return JSON.parse(localStorage.getItem(HOUSEHOLD_NOTIFIED_KEY) || "{}"); } catch (e) { return {}; }
}
function saveNotifiedLog(log) { localStorage.setItem(HOUSEHOLD_NOTIFIED_KEY, JSON.stringify(log)); }

function requestHouseholdNotifications() {
  if (!("Notification" in window)) { showToast("Notifications aren't supported in this browser."); return; }
  Notification.requestPermission().then(perm => {
    if (perm === "granted") { showToast("🔔 Reminders enabled."); checkHouseholdNotifications(); }
    else showToast("Notifications weren't enabled.");
  });
}
function fireHouseholdNotification(item, task, status) {
  new Notification(`${task.safety_critical ? "⚠ Safety — " : ""}${item.name}: ${task.task_name}`, {
    body: status.bucket === "overdue" ? "Overdue" : `Due ${status.nextDueDate}`,
    tag: `${task.id}-${status.nextDueDate}`,
  });
}
// Simple due-date-based checks, no smart timing: safety-critical tasks get a 14-day heads-up
// plus a due-day/overdue notice; routine tasks get a single notice at the due date/overdue.
function checkHouseholdNotifications() {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const log = loadNotifiedLog();
  let changed = false;
  householdState.items.forEach(item => {
    (item.tasks || []).forEach(task => {
      if (task.inactive) return;
      const status = computeTaskStatus(task, item);
      if (status.bucket === "inactive") return;
      const points = task.safety_critical ? [14, 0] : [0];
      points.forEach(p => {
        if (status.daysRemaining !== p) return;
        const key = `${task.id}:${p}:${status.nextDueDate}`;
        if (log[key]) return;
        fireHouseholdNotification(item, task, status);
        log[key] = true; changed = true;
      });
      if (status.bucket === "overdue") {
        const key = `${task.id}:overdue:${status.nextDueDate}`;
        if (!log[key]) { fireHouseholdNotification(item, task, status); log[key] = true; changed = true; }
      }
    });
  });
  if (changed) saveNotifiedLog(log);
}

/* ---------------- Cloud sync (your own private GitHub repo) ---------------- */
const SYNC_CONFIG_KEY = "vmtSyncConfig.v1";
const SYNC_FILE_PATH = "data.json";
const AUTO_PUSH_DEBOUNCE_MS = 4000;

function loadSyncConfig() {
  try {
    const raw = localStorage.getItem(SYNC_CONFIG_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.error(e); }
  return { token: "", owner: "", repo: "", branch: "main", lastPushAt: null, lastPullAt: null, lastSyncedSha: null, dirty: false };
}
function saveSyncConfig(cfg) { localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg)); }
function syncConfigured(cfg) { return !!(cfg.token && cfg.owner && cfg.repo); }

function utf8ToBase64(str) { return btoa(unescape(encodeURIComponent(str))); }
function base64ToUtf8(b64) { return decodeURIComponent(escape(atob(b64.replace(/\n/g, "")))); }

async function githubApi(cfg, path, options = {}) {
  const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}${path}`, {
    ...options,
    cache: "no-store", // never let the browser serve a stale cached sha/content
    headers: {
      "Authorization": `Bearer ${cfg.token}`,
      "Accept": "application/vnd.github+json",
      ...(options.headers || {}),
    },
  });
  return res;
}

/* ---- Pure sync operations (no UI), reused by manual buttons and auto-sync ---- */
async function fetchCloudFile(cfg) {
  const res = await githubApi(cfg, `/contents/${SYNC_FILE_PATH}?ref=${encodeURIComponent(cfg.branch)}`);
  if (res.status === 404) return { notFound: true };
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const e = new Error(err.message || `Fetch failed (${res.status})`);
    e.status = res.status;
    throw e;
  }
  const file = await res.json();
  return { notFound: false, sha: file.sha, content: file.content };
}
async function pushPayloadToCloud(cfg, payload, knownSha) {
  const content = utf8ToBase64(JSON.stringify(payload, null, 2));
  const putRes = await githubApi(cfg, `/contents/${SYNC_FILE_PATH}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message: `Update vehicle tracker data — ${new Date().toISOString()}`,
      content,
      branch: cfg.branch,
      ...(knownSha ? { sha: knownSha } : {}),
    }),
  });
  if (!putRes.ok) {
    const err = await putRes.json().catch(() => ({}));
    const e = new Error(err.message || `Push failed (${putRes.status})`);
    e.status = putRes.status;
    throw e;
  }
  const result = await putRes.json();
  return result.content.sha;
}
function isStaleShaError(e) {
  return e && (e.status === 409 || e.status === 422 || /does not match|sha wasn.?t supplied/i.test(e.message || ""));
}
// Fetches the current file and pushes, automatically re-fetching and retrying if the
// file changed between the fetch and the write (a race between two devices/pushes).
async function pushWithRetry(cfg, payload, maxAttempts = 3) {
  let lastErr;
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    const file = await fetchCloudFile(cfg);
    try {
      const sha = await pushPayloadToCloud(cfg, payload, file.notFound ? null : file.sha);
      return sha;
    } catch (e) {
      lastErr = e;
      if (!isStaleShaError(e)) throw e;
      // Stale sha — someone else wrote in between. Loop to refetch and retry.
    }
  }
  throw lastErr;
}
function markSyncedClean(sha, { push, pull } = {}) {
  const cfg = loadSyncConfig();
  cfg.dirty = false;
  cfg.lastSyncedSha = sha;
  if (push) cfg.lastPushAt = Date.now();
  if (pull) cfg.lastPullAt = Date.now();
  saveSyncConfig(cfg);
}
// Applies cloud data without re-triggering the dirty/auto-push cycle we just satisfied.
async function applyPulledPayloadCleanly(parsed, sha) {
  suppressDirtyTracking = true;
  try { await applyBackupPayload(parsed); }
  finally { suppressDirtyTracking = false; }
  markSyncedClean(sha, { pull: true });
}

/* ---- Toast (small non-blocking status message for background sync activity) ---- */
let toastTimer = null;
function showToast(msg) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 4000);
}

/* ---- Dirty tracking + debounced auto-push, triggered from saveData() ---- */
let suppressDirtyTracking = false;
let autoPushTimer = null;
function markDirtyAndScheduleAutoPush() {
  const cfg = loadSyncConfig();
  if (!syncConfigured(cfg)) return;
  if (!cfg.dirty) { cfg.dirty = true; saveSyncConfig(cfg); }
  clearTimeout(autoPushTimer);
  autoPushTimer = setTimeout(attemptAutoPush, AUTO_PUSH_DEBOUNCE_MS);
}
// Turns a fetch/push failure into a message that actually tells you what to do, instead of a
// generic "something went wrong" — fine-grained GitHub tokens expire (401) and that's by far
// the most common reason auto-sync silently stops working after it's been set up a while.
function syncErrorToastMessage(e) {
  if (e && e.status === 401) return "⚠ Cloud sync token invalid or expired — open Cloud sync to generate a new one.";
  if (e && e.status === 404) return "⚠ Cloud sync repo/branch not found — check the owner/repo/branch in Cloud sync settings.";
  if (e && e.status === 403) return "⚠ Cloud sync blocked (rate-limited or token lacks permission) — open Cloud sync to check.";
  return "⚠ Auto-sync failed — open Cloud sync to check.";
}
async function attemptAutoPush() {
  const cfg = loadSyncConfig();
  if (!syncConfigured(cfg) || !cfg.dirty) return;
  try {
    const file = await fetchCloudFile(cfg);
    if (!file.notFound && cfg.lastSyncedSha && file.sha !== cfg.lastSyncedSha) {
      // Cloud moved since our last known sync point AND we have local changes — real conflict.
      showSyncConflictDialog(file);
      return;
    }
    const payload = await buildBackupPayload();
    const newSha = await pushWithRetry(cfg, payload);
    markSyncedClean(newSha, { push: true });
    showToast("☁ Auto-synced to the cloud.");
    refreshSyncStatusIfDialogOpen();
  } catch (e) {
    console.error("Auto-push failed", e);
    showToast(syncErrorToastMessage(e));
  }
}
// Runs on load and whenever the app becomes visible again — pulls safely if nothing
// local is at risk, or flags a conflict dialog if both sides have changed.
async function autoSyncCheck() {
  const cfg = loadSyncConfig();
  if (!syncConfigured(cfg)) return;
  try {
    const file = await fetchCloudFile(cfg);
    if (file.notFound) return;
    if (cfg.lastSyncedSha && file.sha === cfg.lastSyncedSha) {
      if (cfg.dirty) attemptAutoPush();
      return;
    }
    if (!cfg.dirty) {
      const parsed = JSON.parse(base64ToUtf8(file.content));
      await applyPulledPayloadCleanly(parsed, file.sha);
      showToast("☁ Synced latest changes from the cloud.");
    } else {
      showSyncConflictDialog(file);
    }
  } catch (e) {
    console.error("Auto-sync check failed", e);
    showToast(syncErrorToastMessage(e));
  }
}

/* ---- Conflict resolution dialog ---- */
let pendingConflictFile = null;
function showSyncConflictDialog(file) {
  pendingConflictFile = file;
  showDialog(`
    <h3>⚠️ Sync conflict</h3>
    <p class="vehicle-meta">Your cloud data changed (likely from another device), and this device also has unsynced changes. Pick which version to keep — the other one will be overwritten.</p>
    <div class="dialog-actions" style="justify-content:space-between;">
      <button class="small danger" onclick="resolveConflictKeepLocal()">Keep my changes here</button>
      <button class="small" onclick="resolveConflictUseCloud()">Use cloud version</button>
      <button onclick="closeDialog()">Decide later</button>
    </div>
  `);
}
async function resolveConflictKeepLocal() {
  const cfg = loadSyncConfig();
  try {
    const payload = await buildBackupPayload();
    const newSha = await pushWithRetry(cfg, payload);
    markSyncedClean(newSha, { push: true });
    showToast("☁ Kept your local changes — cloud updated.");
  } catch (e) {
    console.error(e);
    showToast("⚠ Couldn't resolve conflict — try Cloud sync manually.");
  }
  pendingConflictFile = null;
  closeDialog();
}
async function resolveConflictUseCloud() {
  try {
    const parsed = JSON.parse(base64ToUtf8(pendingConflictFile.content));
    await applyPulledPayloadCleanly(parsed, pendingConflictFile.sha);
    showToast("☁ Switched to the cloud version.");
  } catch (e) {
    console.error(e);
    showToast("⚠ Couldn't apply the cloud version.");
  }
  pendingConflictFile = null;
  closeDialog();
}

/* ---- Settings dialog + manual buttons ---- */
function openSyncSettings() {
  const cfg = loadSyncConfig();
  showDialog(`
    <h3>Cloud sync</h3>
    <p class="vehicle-meta">Sync your data (and photos) to a private GitHub repo you control, so you can pick it up on another device. Use a <b>fine-grained personal access token</b> scoped to just that one repo, with "Contents: Read and write" permission — <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">create one here</a>. The token is stored only in this browser.</p>
    <label>GitHub personal access token</label>
    <input id="f-synctoken" type="password" value="${escapeHtml(cfg.token || "")}" placeholder="github_pat_…" />
    <div class="row">
      <div><label>Repo owner</label><input id="f-syncowner" value="${escapeHtml(cfg.owner || "")}" placeholder="e.g. SundaySamurai" /></div>
      <div><label>Repo name</label><input id="f-syncrepo" value="${escapeHtml(cfg.repo || "")}" placeholder="e.g. vehicle-tracker-data" /></div>
      <div><label>Branch</label><input id="f-syncbranch" value="${escapeHtml(cfg.branch || "main")}" /></div>
    </div>
    <p class="vehicle-meta">Once set up, this device auto-pulls when you open the app and auto-pushes shortly after you make a change — the buttons below are for forcing it manually.</p>
    <div id="sync-status" class="vehicle-meta" style="margin-top:6px;">${syncStatusText(cfg)}</div>
    <div class="dialog-actions" style="justify-content:space-between;">
      <div>
        <button class="small" onclick="doSyncPush()">⬆ Push to cloud</button>
        <button class="small" onclick="doSyncPull()">⬇ Pull from cloud</button>
      </div>
      <div>
        <button onclick="closeDialog()">Close</button>
        <button class="primary" onclick="saveSyncSettingsForm()">Save settings</button>
      </div>
    </div>
  `);
}
function syncStatusText(cfg) {
  const parts = [];
  parts.push(cfg.dirty ? "● Unsynced local changes" : "✓ Synced with cloud");
  parts.push(cfg.lastPushAt ? `Last pushed: ${new Date(cfg.lastPushAt).toLocaleString()}` : "Never pushed yet.");
  parts.push(cfg.lastPullAt ? `Last pulled: ${new Date(cfg.lastPullAt).toLocaleString()}` : "Never pulled yet.");
  return parts.join("<br>");
}
function refreshSyncStatusIfDialogOpen() {
  const el = document.getElementById("sync-status");
  if (el) el.innerHTML = syncStatusText(loadSyncConfig());
}
function readSyncSettingsForm() {
  return {
    token: document.getElementById("f-synctoken").value.trim(),
    owner: document.getElementById("f-syncowner").value.trim(),
    repo: document.getElementById("f-syncrepo").value.trim(),
    branch: document.getElementById("f-syncbranch").value.trim() || "main",
  };
}
function saveSyncSettingsForm() {
  const cfg = loadSyncConfig();
  const form = readSyncSettingsForm();
  saveSyncConfig({ ...cfg, ...form });
  closeDialog();
  autoSyncCheck();
}
function setSyncStatus(msg) {
  const el = document.getElementById("sync-status");
  if (el) el.textContent = msg;
}
async function doSyncPush() {
  const form = readSyncSettingsForm();
  if (!form.token || !form.owner || !form.repo) {
    setSyncStatus("Please fill in the token, repo owner, and repo name first.");
    return;
  }
  const cfg = { ...loadSyncConfig(), ...form };
  saveSyncConfig(cfg);
  setSyncStatus("Pushing…");
  try {
    const payload = await buildBackupPayload();
    const newSha = await pushWithRetry(cfg, payload);
    markSyncedClean(newSha, { push: true });
    setSyncStatus(syncStatusText(loadSyncConfig()));
  } catch (e) {
    console.error(e);
    setSyncStatus(`Push failed: ${e.message}`);
  }
}
async function doSyncPull() {
  const form = readSyncSettingsForm();
  if (!form.token || !form.owner || !form.repo) {
    setSyncStatus("Please fill in the token, repo owner, and repo name first.");
    return;
  }
  const cfg = { ...loadSyncConfig(), ...form };
  saveSyncConfig(cfg);
  if (!confirm("This will replace your current data on this device with whatever is in the cloud. Continue?")) return;
  setSyncStatus("Pulling…");
  try {
    const file = await fetchCloudFile(cfg);
    if (file.notFound) {
      setSyncStatus("No data found in the cloud yet — try pushing from a device with data first.");
      return;
    }
    const parsed = JSON.parse(base64ToUtf8(file.content));
    await applyPulledPayloadCleanly(parsed, file.sha);
    setSyncStatus(syncStatusText(loadSyncConfig()));
  } catch (e) {
    console.error(e);
    setSyncStatus(`Pull failed: ${e.message}`);
  }
}

/* ---------------- Import / export (shared with cloud sync) ---------------- */
async function buildBackupPayload() {
  const photoIds = new Set();
  state.vehicles.forEach(v => {
    (v.mileageLog || []).forEach(e => e.photoId && photoIds.add(e.photoId));
    (v.maintenanceItems || []).forEach(i => (i.history || []).forEach(e => e.photoId && photoIds.add(e.photoId)));
  });
  const photos = {};
  for (const id of photoIds) {
    try {
      const blob = await getPhotoBlob(id);
      if (blob) photos[id] = await blobToDataURL(blob);
    } catch (e) { console.error("Failed to read photo for backup", id, e); }
  }
  return { ...state, household: householdState, photos };
}
async function applyBackupPayload(parsed) {
  if (!parsed || !parsed.vehicles) throw new Error("Invalid backup data");
  const photos = parsed.photos || {};
  const household = parsed.household || { items: [] };
  delete parsed.photos;
  delete parsed.household;
  state = parsed;
  householdState = household;
  saveData();
  saveHouseholdData();
  for (const [id, dataURL] of Object.entries(photos)) {
    try {
      const blob = await dataURLToBlob(dataURL);
      await savePhotoBlob(id, blob);
    } catch (e) { console.error("Failed to restore photo", id, e); }
  }
  currentVehicleId = null;
  currentHouseholdItemId = null;
  render();
}

document.getElementById("exportBtn").addEventListener("click", async () => {
  const btn = document.getElementById("exportBtn");
  const originalLabel = btn.textContent;
  btn.textContent = "Exporting…";
  btn.disabled = true;
  try {
    const exportObj = await buildBackupPayload();
    const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `vehicle-maintenance-backup-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  } finally {
    btn.textContent = originalLabel;
    btn.disabled = false;
  }
});
document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed.vehicles) throw new Error("Invalid file");
      if (confirm("This will replace your current data with the imported backup. Continue?")) {
        await applyBackupPayload(parsed);
      }
    } catch (err) {
      console.error(err);
      alert("Could not read that file as a valid backup.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

/* ---------------- Init ---------------- */
render();
autoSyncCheck();
checkHouseholdNotifications();
setInterval(checkHouseholdNotifications, 60 * 60 * 1000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { autoSyncCheck(); checkHouseholdNotifications(); }
});
window.addEventListener("focus", () => autoSyncCheck());
</script>
