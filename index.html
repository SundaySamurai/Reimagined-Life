<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Upkeep</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1a2530;
    --muted: #64748b;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --ok: #16a34a;
    --ok-bg: #dcfce7;
    --warn: #b45309;
    --warn-bg: #fef3c7;
    --bad: #dc2626;
    --bad-bg: #fee2e2;
    --warranty: #7c3aed;
    --warranty-bg: #ede9fe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1720;
      --card: #1a2530;
      --text: #e5edf5;
      --muted: #94a3b8;
      --border: #2b3946;
      --accent: #3b82f6;
      --accent-dark: #60a5fa;
      --ok: #4ade80;
      --ok-bg: #14301f;
      --warn: #fbbf24;
      --warn-bg: #3a2e0d;
      --bad: #f87171;
      --bad-bg: #3a1414;
      --warranty: #a78bfa;
      --warranty-bg: #2c1f47;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 1.4rem; }
  header .sub { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .container { max-width: 960px; margin: 0 auto; padding: 20px 16px 80px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
  button, .btn {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover, .btn:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.danger { color: var(--bad); }
  button.small { padding: 4px 10px; font-size: 0.8rem; }
  a.btn { text-decoration: none; display: inline-block; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .vehicle-card { cursor: pointer; }
  .vehicle-card:hover { border-color: var(--accent); }
  .vehicle-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .vehicle-head h2 { margin: 0 0 4px; font-size: 1.15rem; }
  .vehicle-meta { color: var(--muted); font-size: 0.85rem; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .badge {
    font-size: 0.75rem;
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: 600;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.warranty { background: var(--warranty-bg); color: var(--warranty); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 50px 20px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 140px; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
  input, select, textarea {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }
  textarea { resize: vertical; min-height: 50px; }
  dialog {
    border: none;
    border-radius: 14px;
    padding: 0;
    background: var(--card);
    color: var(--text);
    max-width: 520px;
    width: 92vw;
    max-height: 88vh;
    overflow: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,0.5); }
  .dialog-inner { padding: 20px 22px; }
  .dialog-inner h3 { margin-top: 0; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .item-row:last-child { border-bottom: none; }
  .item-name { font-weight: 600; }
  .item-detail { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .item-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .warranty-note {
    background: var(--warranty-bg);
    color: var(--warranty);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.78rem;
    margin-top: 6px;
  }
  .back-link { color: var(--accent); cursor: pointer; font-size: 0.9rem; margin-bottom: 14px; display: inline-block; }
  .section-title { display: flex; justify-content: space-between; align-items: center; margin: 26px 0 10px; }
  .section-title h3 { margin: 0; }
  .checklist { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .checklist label {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 0.82rem; color: var(--text); margin: 0;
    width: auto;
  }
  .checklist input { width: auto; }
  footer.hint { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 30px; }
  .stat-strip { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .stat { font-size: 0.8rem; color: var(--muted); }
  .stat b { color: var(--text); }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 50;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 0.95; }

  /* App tabs */
  .app-tabs { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .tab-btn { border: none; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; }
  .tab-btn.active { background: var(--accent); color: white; }
  .sub-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .sub-tab-btn { border-radius: 999px; padding: 6px 14px; font-size: 0.85rem; }
  .sub-tab-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

  /* Household tracker — responsibility color encoding */
  .resp-personal { --resp: #2563eb; --resp-bg: #dbeafe; }
  .resp-association { --resp: #64748b; --resp-bg: #e2e8f0; }
  .resp-limited-common-element { --resp: #0d9488; --resp-bg: #ccfbf1; }
  .resp-verify { --resp: #b45309; --resp-bg: #fef3c7; }
  @media (prefers-color-scheme: dark) {
    .resp-personal { --resp: #60a5fa; --resp-bg: #1e3a5f; }
    .resp-association { --resp: #94a3b8; --resp-bg: #2b3946; }
    .resp-limited-common-element { --resp: #2dd4bf; --resp-bg: #0f3d38; }
    .resp-verify { --resp: #fbbf24; --resp-bg: #3a2e0d; }
  }
  .task-row {
    border-left: 4px solid var(--resp);
    background: var(--resp-bg);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .task-row.safety { outline: 2px solid var(--bad); outline-offset: -2px; }
  .task-main { display: flex; flex-direction: column; gap: 2px; }
  .task-title-line { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text); flex-wrap: wrap; }
  .task-sub { font-size: 0.78rem; color: var(--muted); }
  .resp-pill {
    font-size: 0.7rem; font-weight: 700; color: var(--resp);
    background: var(--card); border: 1px solid var(--resp);
    padding: 1px 8px; border-radius: 999px;
  }
  .safety-badge {
    font-size: 0.7rem; font-weight: 700; color: white; background: var(--bad);
    padding: 2px 8px; border-radius: 999px;
  }
  .due-label { font-size: 0.78rem; font-weight: 700; }
  .due-label.overdue { color: var(--bad); }
  .due-label.this_month { color: var(--warn); }
  .due-label.this_quarter { color: var(--accent); }
  .due-label.later { color: var(--muted); }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="appTitle">🚗 Upkeep</h1>
    <div class="sub" id="appSub">Track services, stay ahead of what's due, use your warranty before it lapses.</div>
  </div>
  <div class="toolbar">
    <div class="app-tabs">
      <button class="tab-btn active" id="tab-vehicles" onclick="switchApp('vehicles')">🚗 Vehicles</button>
      <button class="tab-btn" id="tab-household" onclick="switchApp('household')">🏠 Household</button>
    </div>
    <button class="small" title="Sync your data to a private GitHub repo you own" onclick="openSyncSettings()">☁ Cloud sync</button>
    <button id="exportBtn" class="small" title="Backup your data as a JSON file">Export data</button>
    <button id="importBtn" class="small" title="Restore data from a JSON backup">Import data</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" />
  </div>
</header>

<div class="container" id="app"></div>

<dialog id="dialog"></dialog>

<script src="vendor/tesseract/tesseract.min.js"></script>
<script>
/* ---------------- Data layer ---------------- */
const STORAGE_KEY = "vehicleMaintenanceTracker.v1";

const DEFAULT_MAINTENANCE_TEMPLATES = [
  { name: "Oil & filter change", intervalMiles: 5000, intervalMonths: 6 },
  { name: "Tire rotation", intervalMiles: 6000, intervalMonths: 6 },
  { name: "Brake inspection", intervalMiles: 10000, intervalMonths: 12 },
  { name: "Air filter replacement", intervalMiles: 20000, intervalMonths: 12 },
  { name: "Cabin air filter", intervalMiles: 20000, intervalMonths: 12 },
  { name: "Battery check", intervalMiles: null, intervalMonths: 12 },
  { name: "Wiper blades", intervalMiles: null, intervalMonths: 12 },
  { name: "Coolant flush", intervalMiles: 30000, intervalMonths: 30 },
  { name: "Transmission fluid", intervalMiles: 45000, intervalMonths: 36 },
  { name: "Spark plugs", intervalMiles: 60000, intervalMonths: null },
  { name: "Registration / inspection", intervalMiles: null, intervalMonths: 12 },
];

// Sourced directly from the Royal Enfield Hunter 350 owner's manual periodic
// maintenance chart (pages 87-91, items 11-35), using the manual's own km/mile/month
// conversions. The manual notes that past 50,000 km you just repeat this same cycle,
// which the app's recurring intervals already do automatically.
const DEFAULT_MAINTENANCE_TEMPLATES_MOTORCYCLE = [
  // This is a break-in service done exactly once early in the bike's life, not a recurring
  // interval — no intervalMiles/intervalMonths, so once logged done it drops out of Upcoming
  // for good instead of resurfacing every 300mi/2 months forever.
  { name: "First service (oil, filter & full inspection)", intervalMiles: null, intervalMonths: null },
  { name: "Chain cleaning, lubrication & tension check", intervalMiles: 300, intervalMonths: null },
  { name: "Clutch, brake lever & pedal free-play adjustment", intervalMiles: 600, intervalMonths: null },
  { name: "Minor service (multi-point inspection, lubrication, throttle cable & steering check)", intervalMiles: 3000, intervalMonths: 6 },
  { name: "Major service (oil, valve clearance, spark plug, air filter, throttle body clean)", intervalMiles: 6000, intervalMonths: 12 },
  { name: "Spoke tightness / wheel rim runout check", intervalMiles: 6000, intervalMonths: 12 },
  { name: "Front fork oil & front brake fluid replacement", intervalMiles: 12000, intervalMonths: 24 },
  { name: "Fuel filter replacement", intervalMiles: 15000, intervalMonths: 30 },
  { name: "Registration / inspection", intervalMiles: null, intervalMonths: 12 },
];

// Honda's Maintenance Minder adapts to driving conditions rather than printing one
// fixed table, so these are the commonly-documented mileages tied to each Minder
// code (A/B = oil, sub-items 1-7) for a 3rd-gen (2007-2011) CR-V — a solid baseline,
// but less exact than a single official chart. Verify against your own manual/dash
// codes over time. The 2.4L engine uses a timing chain, so no belt to track.
const DEFAULT_MAINTENANCE_TEMPLATES_HONDA_CRV_GEN3 = [
  { name: "Oil & filter change", intervalMiles: 7500, intervalMonths: 12 },
  { name: "Tire rotation", intervalMiles: 7500, intervalMonths: 12 },
  { name: "Engine air filter, cabin air filter & drive belt inspection", intervalMiles: 15000, intervalMonths: 24 },
  { name: "Transmission fluid change", intervalMiles: 30000, intervalMonths: 36 },
  { name: "Spark plugs & valve clearance inspection", intervalMiles: 105000, intervalMonths: 120 },
  { name: "Engine coolant replacement", intervalMiles: 30000, intervalMonths: 36 },
  { name: "Rear differential fluid change (AWD only — skip/delete if FWD)", intervalMiles: 30000, intervalMonths: 36 },
  { name: "Brake fluid replacement", intervalMiles: null, intervalMonths: 36 },
  { name: "Registration / inspection", intervalMiles: null, intervalMonths: 12 },
];
function isHondaCRV(v) {
  return /honda/i.test(v.make || "") && /cr-?v/i.test(v.model || "");
}

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function todayISO() { return new Date().toISOString().slice(0, 10); }

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.error("Failed to load data", e); }
  return { vehicles: [] };
}
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  if (!suppressDirtyTracking) markDirtyAndScheduleAutoPush();
}

let state = loadData();
let currentVehicleId = null;
let pendingReceiptFile = null;
let pendingMileagePhotoFile = null;

/* ---------------- Photo storage (IndexedDB) ---------------- */
const PHOTO_DB_NAME = "vmtPhotosDB";
const PHOTO_STORE = "photos";

function openPhotoDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(PHOTO_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(PHOTO_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function savePhotoBlob(id, blob) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, "readwrite");
    tx.objectStore(PHOTO_STORE).put(blob, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getPhotoBlob(id) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, "readonly");
    const req = tx.objectStore(PHOTO_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function deletePhotoBlob(id) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, "readwrite");
    tx.objectStore(PHOTO_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
async function dataURLToBlob(dataURL) {
  const res = await fetch(dataURL);
  return res.blob();
}

/* ---------------- OCR (Tesseract.js, vendored locally) ---------------- */
let ocrWorkerPromise = null;
function getOcrWorker() {
  if (!ocrWorkerPromise) {
    ocrWorkerPromise = (async () => {
      if (typeof Tesseract === "undefined") throw new Error("OCR engine script not loaded");
      return Tesseract.createWorker("eng", 1, {
        workerPath: "vendor/tesseract/worker.min.js",
        corePath: "vendor/tesseract/tesseract-core-lstm.wasm.js",
        langPath: "vendor/tesseract/",
        cacheMethod: "none",
        gzip: true,
      });
    })();
  }
  return ocrWorkerPromise;
}
async function scanImageText(file) {
  const worker = await getOcrWorker();
  const { data } = await worker.recognize(file);
  return data.text;
}

/* ---------------- Receipt/odometer text parsing heuristics ---------------- */
function guessDateFromText(text) {
  const now = new Date();
  const candidates = [];
  for (const m of text.matchAll(/\b(20\d{2})[\/\-](\d{1,2})[\/\-](\d{1,2})\b/g)) {
    candidates.push(new Date(+m[1], +m[2] - 1, +m[3]));
  }
  for (const m of text.matchAll(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/g)) {
    let y = +m[3];
    if (y < 100) y += y < 50 ? 2000 : 1900;
    candidates.push(new Date(y, +m[1] - 1, +m[2]));
  }
  const months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
  for (const m of text.matchAll(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})\b/gi)) {
    const mi = months.indexOf(m[1].toLowerCase());
    candidates.push(new Date(+m[3], mi, +m[2]));
  }
  const valid = candidates.filter(d => !isNaN(d) && d.getFullYear() >= 1990 && d <= new Date(now.getTime() + 86400000));
  if (valid.length === 0) return null;
  valid.sort((a, b) => b - a);
  return valid[0].toISOString().slice(0, 10);
}
function guessCostFromText(text) {
  // Match "total" but not as part of "subtotal" (negative lookbehind), and prefer
  // the last such match — the grand total typically appears after subtotal/tax lines.
  const totalMatches = [...text.matchAll(/(?<!sub)\btotal\b[^\d$]{0,15}\$?\s?(\d{1,5}(?:,\d{3})*\.\d{2})/gi)];
  if (totalMatches.length) {
    return parseFloat(totalMatches[totalMatches.length - 1][1].replace(/,/g, ""));
  }
  const amounts = [...text.matchAll(/\$\s?(\d{1,5}(?:,\d{3})*\.\d{2})/g)].map(m => parseFloat(m[1].replace(/,/g, "")));
  if (amounts.length === 0) return null;
  return Math.max(...amounts);
}
function guessMileageCandidates(text) {
  const nums = [...text.matchAll(/\b(\d{3,7})\b/g)].map(m => m[1]).filter(s => !/^0+$/.test(s));
  const uniq = [...new Set(nums)];
  uniq.sort((a, b) => b.length - a.length || (+b - +a));
  return uniq.slice(0, 5).map(s => parseInt(s, 10));
}

/* ---------------- Date/mileage math ---------------- */
function addMonths(iso, months) {
  const d = new Date(iso + "T00:00:00");
  d.setMonth(d.getMonth() + months);
  return d.toISOString().slice(0, 10);
}
function daysBetween(iso) {
  const d = new Date(iso + "T00:00:00");
  const now = new Date(todayISO() + "T00:00:00");
  return Math.round((d - now) / 86400000);
}

// "Due soon" warns within this many miles/days of the next due point — but capped as a
// fraction of the item's own interval, so short-cycle items (e.g. a 300mi chain check)
// aren't stuck permanently showing "Due soon" the moment they're logged, since the whole
// interval would otherwise be smaller than the flat warning window.
const DUE_SOON_MILES_MAX = 500;
const DUE_SOON_DAYS_MAX = 30;
const DUE_SOON_FRACTION = 0.15;

function computeItemStatus(item, vehicle) {
  let nextDueMiles = null, nextDueDate = null;
  if (item.intervalMiles) nextDueMiles = (item.lastServiceMileage ?? vehicle.mileage) + item.intervalMiles;
  if (item.intervalMonths) nextDueDate = addMonths(item.lastServiceDate || vehicle.createdAt, item.intervalMonths);

  // A manual one-off reminder date (e.g. "mechanic said come back Dec 1") is independent of
  // mileage/month math. It wins if it's sooner than the interval-computed date, or if there's
  // no interval-computed date at all — covering items with only a manual reminder set.
  let isManualReminder = false;
  if (item.reminderDate && (nextDueDate === null || item.reminderDate < nextDueDate)) {
    nextDueDate = item.reminderDate;
    isManualReminder = true;
  }

  const milesRemaining = nextDueMiles !== null ? nextDueMiles - vehicle.mileage : null;
  const daysRemaining = nextDueDate !== null ? daysBetween(nextDueDate) : null;

  const milesDueSoonThreshold = item.intervalMiles
    ? Math.min(DUE_SOON_MILES_MAX, Math.ceil(item.intervalMiles * DUE_SOON_FRACTION))
    : DUE_SOON_MILES_MAX;
  const daysDueSoonThreshold = item.intervalMonths && !isManualReminder
    ? Math.min(DUE_SOON_DAYS_MAX, Math.ceil(item.intervalMonths * 30 * DUE_SOON_FRACTION))
    : DUE_SOON_DAYS_MAX;

  let status = "ok";
  if ((milesRemaining !== null && milesRemaining <= 0) || (daysRemaining !== null && daysRemaining <= 0)) {
    status = "bad";
  } else if ((milesRemaining !== null && milesRemaining <= milesDueSoonThreshold) || (daysRemaining !== null && daysRemaining <= daysDueSoonThreshold)) {
    status = "warn";
  }
  return { nextDueMiles, nextDueDate, milesRemaining, daysRemaining, status, isManualReminder };
}

function warrantyStatus(w, vehicle) {
  let expiredByDate = false, expiredByMiles = false;
  if (w.durationMonths) {
    const end = addMonths(w.startDate, w.durationMonths);
    expiredByDate = daysBetween(end) < 0;
  }
  if (w.mileageLimit) {
    expiredByMiles = vehicle.mileage > w.mileageLimit;
  }
  const active = !expiredByDate && !expiredByMiles && daysBetween(w.startDate) <= 0;
  return { active, expiredByDate, expiredByMiles };
}

/* ---------------- Rendering ---------------- */
const app = document.getElementById("app");

let activeApp = "vehicles";
function switchApp(name) {
  activeApp = name;
  document.getElementById("tab-vehicles").classList.toggle("active", name === "vehicles");
  document.getElementById("tab-household").classList.toggle("active", name === "household");
  document.getElementById("appTitle").textContent = name === "vehicles" ? "🚗 Upkeep — Vehicles" : "🏠 Upkeep — Household";

    ? "Track services, stay ahead of what's due, use your warranty before it lapses."
    : "Know what's yours to do, and what the HOA's got.";
  render();
}

function render() {
  if (activeApp === "household") return renderHouseholdApp();
  return renderVehicleApp();
}
function renderVehicleApp() {
  if (currentVehicleId) {
    const v = state.vehicles.find(v => v.id === currentVehicleId);

}

function overallVehicleBadges(v) {
  const badges = [];
  let worst = "ok", warrantyFlag = false;
  (v.maintenanceItems || []).forEach(item => {
    const s = computeItemStatus(item, v).status;
    if (s === "bad") worst = "bad";
    else if (s === "warn" && worst !== "bad") worst = "warn";
  });
  (v.warranties || []).forEach(w => { if (warrantyStatus(w, v).active) warrantyFlag = true; });
  if (worst === "bad") badges.push(["bad", "Overdue service"]);
  else if (worst === "warn") badges.push(["warn", "Service due soon"]);
  else badges.push(["ok", "Up to date"]);
  if (warrantyFlag) badges.push(["warranty", "Active warranty"]);
  return badges;
}

function renderDashboard() {
  let html = "";

    html += `<div class="empty card">

      <button class="primary" onclick="openVehicleForm()">+ Add a vehicle</button>

}

function itemUrgencyKey(s) {
  if (s.daysRemaining !== null) return s.daysRemaining;
  if (s.milesRemaining !== null) return s.milesRemaining;
  return Infinity;
}
function renderMaintenanceItemRow(item, s, v, warranties) {
  const badgeCls = s.status;
  const badgeLabel = s.status === "bad" ? "Overdue" : s.status === "warn" ? "Due soon" : "OK";
  let detailParts = [];
  if (s.nextDueMiles !== null) detailParts.push(`next at ${s.nextDueMiles.toLocaleString()} mi`);
  if (s.nextDueDate !== null) detailParts.push(s.isManualReminder ? `reminder set for ${s.nextDueDate}` : `by ${s.nextDueDate}`);
  const linkedWarranty = warranties.find(w => w.id === item.warrantyId);
  let warrantyNote = "";
  if (linkedWarranty && (s.status === "bad" || s.status === "warn")) {
    const ws = warrantyStatus(linkedWarranty, v);
    if (ws.active) {
      warrantyNote = `<div class="warranty-note">⚠️ May be covered under "${escapeHtml(linkedWarranty.name)}" warranty (${escapeHtml(linkedWarranty.provider || "")}) — check before paying out of pocket.</div>`;
    }
  }
  const calLink = googleCalendarLink(item, s, v);
  return `<div class="item-row">
    <div>
      <div class="item-name">${escapeHtml(item.name)}</div>
      <div class="item-detail">${detailParts.join(" &middot; ") || "no schedule set"}${item.lastServiceDate ? ` &middot; last done ${item.lastServiceDate}` : ""}</div>
      ${warrantyNote}
    </div>
    <div class="item-actions">
      <span class="badge ${badgeCls}">${badgeLabel}</span>
      ${calLink ? `<a class="btn small" target="_blank" href="${calLink}">📅 Add reminder</a>` : ""}
      <button class="small" onclick="logService('${v.id}','${item.id}')">Log done</button>
      <button class="small" onclick="openHistory('${v.id}','${item.id}')">History (${(item.history || []).length})</button>
      <button class="small" onclick="openMaintenanceForm('${v.id}','${item.id}')">Edit</button>
      <button class="small danger" onclick="deleteMaintenance('${v.id}','${item.id}')">Delete</button>
    </div>
  </div>`;
}
function renderVehicleDoneFeed(v) {
  const entries = [];
  (v.maintenanceItems || []).forEach(item => {
    (item.history || []).forEach(h => entries.push({ item, h }));
  });
  entries.sort((a, b) => (b.h.date || "").localeCompare(a.h.date || ""));
  const recent = entries.slice(0, 15);
  if (recent.length === 0) return `<p class="vehicle-meta">Nothing logged yet.</p>`;
  return recent.map(({ item, h }) => `
    <div class="item-row">
      <div>
        <div class="item-name">${escapeHtml(item.name)}</div>
        <div class="item-detail">${h.date || "—"}${h.mileage != null ? ` &middot; ${h.mileage.toLocaleString()} mi` : ""}${h.cost != null ? ` &middot; $${h.cost.toFixed(2)}` : ""}${h.notes ? ` — ${escapeHtml(h.notes).slice(0, 120)}` : ""}</div>
      </div>
      <div class="item-actions">
        ${h.photoId ? `<button class="small" onclick="viewPhoto('${h.photoId}')">📷 View</button>` : ""}
        <button class="small" onclick="editHistoryEntry('${v.id}','${item.id}','${h.id}')">Edit</button>
        <button class="small danger" onclick="deleteHistoryEntryFromDone('${v.id}','${item.id}','${h.id}')">Delete</button>
      </div>
    </div>`).join("");
}

function renderVehicleDetail(v) {
  const items = v.maintenanceItems || [];
  const warranties = v.warranties || [];

  const statused = items.map(item => ({ item, s: computeItemStatus(item, v) }));
  const pending = statused.filter(x => x.s.status === "bad")
    .sort((a, b) => itemUrgencyKey(a.s) - itemUrgencyKey(b.s));
  // An item with no active schedule (no interval, no reminder) that's actually been logged
  // done at least once — e.g. a one-time break-in service — is done for good, so it only
  // lives on in the Done feed from here on instead of sitting in Upcoming forever with "no
  // schedule set." Keyed off real history entries (the Done feed's source of truth), not
  // just lastServiceDate, since a never-logged item with no schedule still needs a home.
  const hasActiveSchedule = s => s.nextDueMiles !== null || s.nextDueDate !== null;
  const hasCompletionRecord = item => !!(item.history && item.history.length);
  const upcoming = statused.filter(x => x.s.status !== "bad" && (hasActiveSchedule(x.s) || !hasCompletionRecord(x.item)))
    .sort((a, b) => {
      const order = { warn: 0, ok: 1 };
      const oc = order[a.s.status] - order[b.s.status];
      return oc !== 0 ? oc : itemUrgencyKey(a.s) - itemUrgencyKey(b.s);
    });

  let html = `<span class="back-link" onclick="goHome()">&larr; All vehicles</span>
  <div class="card">
    <div class="vehicle-head">
      <div>
        <h2>${vehicleTypeIcon(v.type)} ${escapeHtml(v.nickname)}</h2>
        <div class="vehicle-meta">${v.year || ""} ${escapeHtml(v.make || "")} ${escapeHtml(v.model || "")}${v.type ? ` &middot; ${escapeHtml(v.type)}` : ""}${v.vin ? " &middot; VIN " + escapeHtml(v.vin) : ""}</div>
      </div>
      <div class="item-actions">
        <button class="small" onclick="openVehicleForm('${v.id}')">Edit</button>
        <button class="small danger" onclick="deleteVehicle('${v.id}')">Delete</button>
      </div>
    </div>
    <div class="stat-strip">
      <div class="stat">Current mileage: <b>${v.mileage.toLocaleString()} mi</b></div>
      <button class="small" onclick="openMileageForm('${v.id}')">Update mileage</button>
      <button class="small" onclick="openMileageHistory('${v.id}')">Mileage history (${(v.mileageLog || []).length})</button>
    </div>
  </div>`;

  const templateLabel = v.type === "Motorcycle" ? "motorcycle "
    : isHondaCRV(v) ? "Honda CR-V "
    : "";
  html += `<div class="section-title">
    <h3>Maintenance</h3>
    <div class="item-actions">
      <button class="small" onclick="addDefaultTemplates('${v.id}')" title="Adds any standard ${templateLabel}items you don't already have — safe to click anytime, never creates duplicates">+ Add common ${templateLabel}items</button>
      <button class="small primary" onclick="openMaintenanceForm('${v.id}')">+ Add item</button>
    </div>
  </div>`;

  if (items.length === 0) {
    html += `<div class="card">
      <p class="vehicle-meta">No maintenance items yet. Add one, or add all common defaults above.</p>
    </div>`;
  } else {
    html += `<div class="section-title"><h3>⚠️ Pending${pending.length ? ` (${pending.length})` : ""}</h3></div>
    <div class="card">${pending.length ? pending.map(({ item, s }) => renderMaintenanceItemRow(item, s, v, warranties)).join("") : `<p class="vehicle-meta">Nothing overdue right now 🎉</p>`}</div>

    <div class="section-title"><h3>📅 Upcoming${upcoming.length ? ` (${upcoming.length})` : ""}</h3></div>
    <div class="card">${upcoming.length ? upcoming.map(({ item, s }) => renderMaintenanceItemRow(item, s, v, warranties)).join("") : `<p class="vehicle-meta">Nothing else scheduled.</p>`}</div>

    <div class="section-title"><h3>✅ Done</h3></div>
    <div class="card">${renderVehicleDoneFeed(v)}</div>`;
  }

  html += `<div class="section-title">
    <h3>Warranties</h3>
    <button class="small primary" onclick="openWarrantyForm('${v.id}')">+ Add warranty</button>
  </div>
  <div class="card">`;
  if (warranties.length === 0) {
    html += `<p class="vehicle-meta">No warranties tracked yet.</p>`;
  } else {
    warranties.forEach(w => {
      const ws = warrantyStatus(w, v);
      const end = w.durationMonths ? addMonths(w.startDate, w.durationMonths) : null;
      html += `<div class="item-row">
        <div>
          <div class="item-name">${escapeHtml(w.name)}</div>
          <div class="item-detail">
            ${escapeHtml(w.provider || "")}${end ? ` &middot; expires ${end}` : ""}${w.mileageLimit ? ` &middot; up to ${w.mileageLimit.toLocaleString()} mi` : ""}
          </div>
          ${w.notes ? `<div class="item-detail">${escapeHtml(w.notes)}</div>` : ""}
        </div>
        <div class="item-actions">
          <span class="badge ${ws.active ? "ok" : "bad"}">${ws.active ? "Active" : "Expired"}</span>
          <button class="small" onclick="openWarrantyForm('${v.id}','${w.id}')">Edit</button>
          <button class="small danger" onclick="deleteWarranty('${v.id}','${w.id}')">Delete</button>
        </div>
      </div>`;
    });
  }
  html += `</div>`;

  app.innerHTML = html;
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function vehicleTypeIcon(type) {
  return type === "Motorcycle" ? "🏍️" : "🚗";
}

function googleCalendarLink(item, s, vehicle) {
  // If already due/overdue (by either mileage or date), remind today.
  // Otherwise use the date-based due date if there is one.
  let dateISO;
  if (s.status === "bad" || s.status === "warn") {
    dateISO = todayISO();
  } else {
    dateISO = s.nextDueDate || (s.nextDueMiles ? todayISO() : null);
  }
  if (!dateISO) return null;
  const start = dateISO.replace(/-/g, "");
  const endDate = new Date(dateISO + "T00:00:00");
  endDate.setDate(endDate.getDate() + 1);
  const end = endDate.toISOString().slice(0, 10).replace(/-/g, "");
  const text = encodeURIComponent(`${item.name} due — ${vehicle.nickname}`);
  const detailsParts = [];
  if (s.nextDueMiles) detailsParts.push(`Due by ${s.nextDueMiles.toLocaleString()} miles`);
  if (s.nextDueDate) detailsParts.push(`Due by ${s.nextDueDate}`);
  const details = encodeURIComponent(detailsParts.join(". "));
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${start}/${end}&details=${details}`;
}

async function handleMileagePhotoSelected(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  pendingMileagePhotoFile = file;
  const preview = document.getElementById("f-mileagephoto-preview");
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  const status = document.getElementById("f-mileagephoto-status");
  status.textContent = "Scanning odometer…";
  try {
    const text = await scanImageText(file);
    const candidates = guessMileageCandidates(text);
    const box = document.getElementById("f-mileage-candidates");
    if (candidates.length) {
      box.innerHTML = candidates.map(n =>
        `<button type="button" class="small" onclick="document.getElementById('f-newmileage').value=${n}">${n.toLocaleString()} mi</button>`
      ).join("");
      document.getElementById("f-newmileage").value = candidates[0];
      status.textContent = "Scanned — pick the correct number above or edit it directly.";
    } else {
      status.textContent = "Couldn't find a clear number in the photo — please enter it manually.";
    }
  } catch (e) {
    console.error(e);
    status.textContent = "Automatic scanning isn't available right now — you can still attach the photo and enter the mileage manually. (This needs the app served over http/https, not opened directly as a file.)";
  }

function saveMaintenanceForm(vehicleId, itemId) {

async function handleReceiptPhotoSelected(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  pendingReceiptFile = file;
  const preview = document.getElementById("f-donephoto-preview");
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  const status = document.getElementById("f-donephoto-status");
  status.textContent = "Scanning receipt…";
  try {
    const text = await scanImageText(file);
    const date = guessDateFromText(text);
    const cost = guessCostFromText(text);
    if (date) document.getElementById("f-donedate").value = date;
    if (cost != null) document.getElementById("f-donecost").value = cost.toFixed(2);
    const notesEl = document.getElementById("f-donenotes");
    if (!notesEl.value.trim()) notesEl.value = text.trim().slice(0, 500);
    status.textContent = "Scanned — please review the fields below before saving.";
  } catch (e) {
    console.error(e);
    status.textContent = "Automatic scanning isn't available right now — you can still attach the photo and fill in the fields manually. (This needs the app served over http/https, not opened directly as a file.)";
  }
}
async function confirmLogService(vehicleId, itemId) {
  const v = state.vehicles.find(v => v.id === vehicleId);
  const item = v.maintenanceItems.find(i => i.id === itemId);
  const date = document.getElementById("f-donedate").value || todayISO();
  const mileage = parseInt(document.getElementById("f-donemiles").value, 10) || v.mileage;
  const costRaw = document.getElementById("f-donecost").value;
  const cost = costRaw ? parseFloat(costRaw) : null;
  const notes = document.getElementById("f-donenotes").value.trim();

  const entry = { id: uid(), date, mileage, cost, notes, photoId: null };
  if (pendingReceiptFile) {
    entry.photoId = uid();
    try { await savePhotoBlob(entry.photoId, pendingReceiptFile); }
    catch (e) { console.error("Failed to store receipt photo", e); entry.photoId = null; }
  }
  item.history = item.history || [];
  item.history.push(entry);
  item.lastServiceDate = date;
  item.lastServiceMileage = mileage;
  // A pure one-off reminder (no recurring interval) is fulfilled once logged — clear it so the
  // item doesn't stay pinned to that now-past date forever. A recurring interval still applies.
  if (item.reminderDate && !item.intervalMiles && !item.intervalMonths) item.reminderDate = null;
  if (mileage > v.mileage) v.mileage = mileage;
  pendingReceiptFile = null;
  saveData();
  closeDialog();
  render();
}
function addDefaultTemplates(vehicleId) {
  const v = state.vehicles.find(v => v.id === vehicleId);
  v.maintenanceItems = v.maintenanceItems || [];
  const templates = v.type === "Motorcycle" ? DEFAULT_MAINTENANCE_TEMPLATES_MOTORCYCLE
    : isHondaCRV(v) ? DEFAULT_MAINTENANCE_TEMPLATES_HONDA_CRV_GEN3
    : DEFAULT_MAINTENANCE_TEMPLATES;
  // Idempotent by name so this can be clicked again later to top up any missing standard
  // items (e.g. after adding a few individually) without ever creating duplicate items.
  const existingNames = new Set(v.maintenanceItems.map(i => i.name.trim().toLowerCase()));
  let added = 0;
  templates.forEach(t => {
    if (existingNames.has(t.name.trim().toLowerCase())) return;
    // Snap to the most recent point in this item's cycle at or below the current
    // mileage, rather than assuming everything was just serviced today — so a
    // used vehicle's schedule reflects where it actually sits in the cycle.
    const lastServiceMileage = t.intervalMiles
      ? Math.floor(v.mileage / t.intervalMiles) * t.intervalMiles
      : v.mileage;
    const lastServiceDate = todayISO();
    v.maintenanceItems.push({
      id: uid(), name: t.name, intervalMiles: t.intervalMiles, intervalMonths: t.intervalMonths,
      lastServiceDate, lastServiceMileage, warrantyId: null,
      // A real (editable/deletable) history entry, not just a bare lastServiceDate field, so
      // this seeded baseline shows up in the Done feed like any other logged completion.
      history: [{ id: uid(), date: lastServiceDate, mileage: lastServiceMileage, cost: null, notes: "Seeded as already up to date when common maintenance defaults were added.", photoId: null }],
    });
    added++;
  });
  saveData();
  showToast(added > 0 ? `Added ${added} common maintenance item${added === 1 ? "" : "s"}.` : "You already have all the common items for this vehicle.");
  render();
}

/* ---------------- Date/interval math ---------------- */
function addInterval(iso, type, value) {
  if (type === "days") {
    const d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + value);
    return d.toISOString().slice(0, 10);
  }
  if (type === "weeks") {
    const d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + value * 7);
    return d.toISOString().slice(0, 10);
  }
  if (type === "years") return addMonths(iso, value * 12);
  return addMonths(iso, value);
}
function intervalLabel(type, value) {
  const unit = { days: "day", weeks: "week", months: "month", years: "year" }[type] || type;
  return `every ${value} ${unit}${value === 1 ? "" : "s"}`;
}
function computeTaskStatus(task, item) {
  if (task.inactive) return { nextDueDate: null, daysRemaining: null, bucket: "inactive" };
  const base = task.last_completed_date || item.install_date || item.createdAt || todayISO();
  const nextDueDate = addInterval(base, task.interval_type, task.interval_value);
  const daysRemaining = daysBetween(nextDueDate);
  let bucket;
  if (daysRemaining < 0) bucket = "overdue";
  else if (daysRemaining <= 30) bucket = "this_month";
  else if (daysRemaining <= 90) bucket = "this_quarter";
  else bucket = "later";
  return { nextDueDate, daysRemaining, bucket };
}
function responsibilityClass(r) { return `resp-${(r || "verify").replace(/_/g, "-")}`; }
function locationIcon(loc) { return loc === "outside_unit" ? "🏢" : "🏠"; }

function allHouseholdTaskRows({ personalOnly } = {}) {
  const rows = [];
  householdState.items.forEach(item => {
    (item.tasks || []).forEach(task => {
      if (task.inactive) return;
      if (personalOnly && item.responsibility !== "personal") return;
      rows.push({ item, task, status: computeTaskStatus(task, item) });
    });
  });
  const bucketOrder = { overdue: 0, this_month: 1, this_quarter: 2, later: 3 };
  rows.sort((a, b) => {
    const bo = bucketOrder[a.status.bucket] - bucketOrder[b.status.bucket];
    if (bo !== 0) return bo;
    const sc = (b.task.safety_critical ? 1 : 0) - (a.task.safety_critical ? 1 : 0);
    if (sc !== 0) return sc;
    return (a.status.daysRemaining ?? 0) - (b.status.daysRemaining ?? 0);
  });
  return rows;
}
